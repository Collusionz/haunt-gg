    .affiliation-card:hover .affiliation-bg { transform: scale(1.05); }
    .affiliation-bg { position: absolute; inset: 0; background-size: cover; background-position: center; background-color: rgba(10,10,10,0.8); transition: transform 0.5s ease; }
    .affiliation-gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.4), transparent); }
    .btn-badge { background-color: rgba(218,220,247,0.1); border: 1px solid rgba(110,184,236,0.23); border-radius: 26px; color: #ccd8ec; padding: 0.25rem 0.625rem; font-size: 0.875rem; font-weight: 500; backdrop-filter: blur(12px); display: inline-flex; align-items: center; gap: 0.25rem; }
    .like-btn, .dislike-btn { color: #c1c8ec; transition: color 0.2s ease; cursor: pointer; background: none; border: none; padding: 4px; }

    .like-btn.active { color: #ff4466; }

    .social-link { display: inline-flex; align-items: center; justify-content: center; width: 3rem; height: 3rem; border-radius: 50%; border: 2px solid rgba(110,184,236,0.13); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); color: #ccd8ec; transition: background 0.2s, color 0.2s, transform 0.2s; text-decoration: none; }
    .social-link:hover { background: rgba(255,255,255,0.08); color: #fff; transform: translateY(-2px); }
    .skeleton { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; background: rgba(255,255,255,0.1); border-radius: 0.375rem; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .scroll-fade-in { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .scroll-fade-in.visible { opacity: 1; transform: translateY(0); }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .anim-reveal { animation: fadeInUp 0.5s ease forwards; }
    .anim-delay-1 { animation-delay: 0.1s; opacity: 0; }
    .anim-delay-2 { animation-delay: 0.2s; opacity: 0; }
    .anim-delay-3 { animation-delay: 0.3s; opacity: 0; }
    .anim-delay-4 { animation-delay: 0.4s; opacity: 0; }
    .anim-delay-5 { animation-delay: 0.5s; opacity: 0; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .clock-face { width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); position: relative; margin: 0 auto; }
    .clock-hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; border-radius: 2px; }
    .clock-hour { width: 3px; height: 30px; background: #fff; }
    .clock-minute { width: 2px; height: 40px; background: rgba(255,255,255,0.8); }
    .clock-second { width: 1px; height: 45px; background: #ff4466; }
    .clock-center { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; border-radius: 50%; background: #fff; transform: translate(-50%,-50%); z-index: 5; }

    // ========== DISCORD WIDGET (Lanyard) ==========
    function statusColor(status) {
      return { online: '#23A55A', idle: '#F0B232', dnd: '#F23F43', offline: '#80848E' }[status] || '#80848E';
    }

    function renderDiscord(data) {
      const el = document.getElementById('discordWidget');
      const u = data.discord_user;
      const avatarUrl = u.avatar
        ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=128`
        : `https://cdn.discordapp.com/embed/avatars/${parseInt(u.discriminator || '0') % 5}.png`;
      const status = data.discord_status || 'offline';
      const activities = data.activities || [];
      const spotify = data.listening_to_spotify ? data.spotify : null;

      let detail = '';
      if (spotify && (spotify.track || spotify.song)) {
        const track = spotify.track || spotify.song || '';
        const artist = spotify.artist || '';
        detail = `<span style="color:#1DB954">Listening to</span> <strong>${track}</strong>`;
        if (artist) detail += ` <span style="opacity:0.6">by ${artist}</span>`;
      } else if (activities.length > 0) {
        const playing = activities.find(a => a.type === 3 || (a.name && a.name !== 'Custom Status' && a.name !== 'Spotify'));
        const custom = activities.find(a => a.name === 'Custom Status');
        if (playing) {
          const name = playing.name || '';
          const details = playing.details || '';
          const state = playing.state || '';
          detail = details || state || name;
        } else if (custom && custom.state) {
          detail = custom.state;
        } else {
          detail = `<span style="opacity:0.5">${status.charAt(0).toUpperCase() + status.slice(1)}</span>`;
        }
      } else {
        detail = `<span style="opacity:0.5">${status.charAt(0).toUpperCase() + status.slice(1)}</span>`;
      }

      let activityImg = '';
      if (spotify && spotify.album_art_url) {
        activityImg = `<img src="${spotify.album_art_url}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0" />`;
      } else if (activities.length > 0 && activities[0].assets?.large_image) {
        let img = activities[0].assets.large_image;
        if (img.startsWith('mp:external')) img = 'https://media.discordapp.net/external/' + img.replace('mp:external/', '');
        activityImg = `<img src="${img}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0" />`;
      }

      el.innerHTML = `
        <img src="${avatarUrl}" style="width:74px;height:74px;border-radius:14px;object-fit:cover;flex-shrink:0" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" />
        <div style="display:flex;flex-direction:column;min-width:0;flex:1">

          <div style="font-size:0.8rem;color:#9CA3AF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">${detail}</div>

    function loadDiscord() {
      fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`)
        .then(r => r.json())
        .then(d => { if (d.success) renderDiscord(d.data); else showError('discordWidget', 'Join discord.gg/lanyard to enable'); })

    // ========== ROBLOX WIDGET ==========
    function renderRoblox(userId, username, displayName, avatarUrl) {
      const el = document.getElementById('robloxWidget');
      el.innerHTML = `
        <img src="${avatarUrl}" style="width:74px;height:74px;border-radius:14px;object-fit:cover;flex-shrink:0" onerror="this.style.background='#333'" />
        <div style="display:flex;flex-direction:column;min-width:0;flex:1">
          <div style="font-weight:600;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${displayName || username}</div>
          <div style="font-size:0.8rem;color:#9CA3AF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">@${username}</div>
          <a href="https://roblox.com/users/${userId}/profile" target="_blank" rel="noopener" style="font-size:0.75rem;color:#5573f4;text-decoration:none;margin-top:2px">View Profile</a>
        </div>
      `;
    }

    function loadRoblox() {
      fetch(`https://api.roblox.com/users/get-by-username?username=${ROBLOX_USERNAME}`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(user => {
        if (user && user.Id) {
          fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${user.Id}&size=150x150&format=Png&isCircular=false`)
            .then(r => r.json())
            .then(t => {
              const thumb = t.data && t.data[0] ? t.data[0].imageUrl : '';
              renderRoblox(user.Id, user.Name, user.DisplayName, thumb);
            })
            .catch(() => renderRoblox(user.Id, user.Name, user.DisplayName, ''));
        } else {
          showError('robloxWidget', 'User not found');
        }
      })
      .catch(() => showError('robloxWidget', 'Unable to load'));
    }

    // ========== TIME WIDGET ==========
    function renderTime() {
      const el = document.getElementById('timeWidget');
      const now = new Date();
      const options = { timeZone: TIMEZONE, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      const dateOpts = { timeZone: TIMEZONE, weekday: 'short', month: 'short', day: 'numeric' };
      const timeStr = now.toLocaleTimeString('en-US', options);
      const dateStr = now.toLocaleDateString('en-US', dateOpts);

      // Analog clock
      const tzParts = now.toLocaleTimeString('en-US', { timeZone: TIMEZONE, hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false });
      const [h, m, s] = tzParts.split(':').map(Number);
      const hourDeg = ((h % 12) + m / 60) * 30;
      const minDeg = (m + s / 60) * 6;
      const secDeg = s * 6;

      let marks = '';
      for (let i = 0; i < 12; i++) {
        marks += `<div class="clock-mark" style="transform:translateX(-50%) rotate(${i * 30}deg);transform-origin:bottom center;top:4px;left:calc(50% - 1px);position:absolute;width:2px;height:6px;background:rgba(255,255,255,0.3)"></div>`;
      }

      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:14px;width:100%;justify-content:center">
          <div class="clock-face" style="width:80px;height:80px;flex-shrink:0">
            <div class="clock-center"></div>
            <div class="clock-hand clock-hour" style="transform:translateX(-50%) rotate(${hourDeg}deg);height:22px"></div>
            <div class="clock-hand clock-minute" style="transform:translateX(-50%) rotate(${minDeg}deg);height:30px"></div>
            <div class="clock-hand clock-second" style="transform:translateX(-50%) rotate(${secDeg}deg);height:33px"></div>
          </div>
          <div style="text-align:left">
            <div style="font-size:1.1rem;font-weight:600">${timeStr}</div>
            <div style="font-size:0.75rem;color:#9CA3AF">${dateStr}</div>
            <div style="font-size:0.7rem;color:#6B7280;margin-top:2px">${TIMEZONE}</div>
          </div>
        </div>
      `;
    }

    function loadTime() {
      renderTime();
      setInterval(renderTime, 1000);
    }

    // ========== WEATHER WIDGET (Open-Meteo) ==========
    const WMO_CODES = {
      0: ['Clear', '☀️'], 1: ['Mainly Clear', '🌤️'], 2: ['Partly Cloudy', '⛅'], 3: ['Overcast', '☁️'],
      45: ['Fog', '🌫️'], 48: ['Rime Fog', '🌫️'],
      51: ['Light Drizzle', '🌦️'], 53: ['Drizzle', '🌦️'], 55: ['Heavy Drizzle', '🌧️'],
      61: ['Light Rain', '🌧️'], 63: ['Rain', '🌧️'], 65: ['Heavy Rain', '🌧️'],
      71: ['Light Snow', '🌨️'], 73: ['Snow', '🌨️'], 75: ['Heavy Snow', '❄️'],
      80: ['Light Showers', '🌦️'], 81: ['Showers', '🌧️'], 82: ['Heavy Showers', '🌧️'],
      95: ['Thunderstorm', '⛈️'], 96: ['Thunderstorm + Hail', '⛈️'], 99: ['Heavy T-storm + Hail', '⛈️']
    };

    function renderWeather(data, city) {
      const el = document.getElementById('weatherWidget');
      const temp = Math.round(data.current.temperature_2m);
      const feelsLike = Math.round(data.current_apparent?.temperature_2m || temp);
      const humidity = data.current.relative_humidity_2m;
      const wind = Math.round(data.current.wind_speed_10m);
      const code = data.current.weather_code;
      const [label, icon] = WMO_CODES[code] || ['Unknown', '❓'];

      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;width:100%">
          <div style="font-size:2rem;flex-shrink:0">${icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:1.5rem;font-weight:700">${temp}°C</div>
            <div style="font-size:0.8rem;color:#9CA3AF">${label} · Feels like ${feelsLike}°C</div>
            <div style="font-size:0.7rem;color:#6B7280;margin-top:2px">💧 ${humidity}% · 💨 ${wind} km/h</div>
          </div>
          <div style="font-size:0.7rem;color:#6B7280;text-align:right;flex-shrink:0">${city}</div>
        </div>
      `;
    }

    function loadWeather() {
      fetch('https://api.open-meteo.com/v1/forecast?latitude=1.29&longitude=103.85&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&current_apparent=temperature_2m&timezone=Asia/Singapore')
        .then(r => r.json())
        .then(d => renderWeather(d, 'Singapore'))
        .catch(() => showError('weatherWidget', 'Unable to load weather'));
    }

    // ========== LAST.FM WIDGET ==========
    let lastfmUserInfo = null;

    function renderLastfm(recentData, userInfo) {
      const el = document.getElementById('lastfmWidget');
      const tracks = recentData.recenttracks.track;
      if (!tracks || tracks.length === 0) { showError('lastfmWidget', 'No recent tracks'); return; }

      const nowPlaying = tracks.find(t => t['@attr'] && t['@attr'].nowplaying);
      const playcount = userInfo ? userInfo.playcount : '—';
      const artistCount = userInfo ? userInfo.artist_count : '—';

      let tracksHtml = '';
      const displayTracks = nowPlaying ? tracks : tracks.slice(0, 5);
      displayTracks.slice(0, 5).forEach((t, i) => {
        const isNP = t['@attr'] && t['@attr'].nowplaying;
        const img = t.image && t.image.length > 0 ? t.image[t.image.length - 1]['#text'] : '';
        const artist = typeof t.artist === 'object' ? (t.artist['#text'] || '') : (t.artist || '');
        const name = t.name || '';
        const time = t.date ? (t.date['#text'] || '') : '';

        tracksHtml += `
          <div style="display:flex;align-items:center;gap:10px;padding:6px 14px;${i < 4 ? 'border-bottom:1px solid rgba(255,255,255,0.05);' : ''}">
            <img src="${img}" style="width:36px;height:36px;border-radius:6px;object-fit:cover;flex-shrink:0" onerror="this.style.background='#333';this.src=''" />
            <div style="flex:1;min-width:0">
              <div style="font-size:0.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff">${name}</div>
              <div style="font-size:0.75rem;color:#9CA3AF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${artist}</div>
            </div>
            <div style="font-size:0.7rem;color:#6B7280;flex-shrink:0;white-space:nowrap">${isNP ? '<span style="color:#1DB954">● now playing</span>' : time}</div>
          </div>
        `;
      });

      el.innerHTML = `
        <div style="display:flex;flex-direction:column;height:100%">
          <!-- Header -->
          <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.05)">
            <div style="flex:1;min-width:0">
              <div style="font-size:0.65rem;color:#6B7280;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px">Last.fm</div>
              <div style="font-weight:600;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${LASTFM_USERNAME}</div>
              <div style="font-size:0.75rem;color:#9CA3AF;margin-top:1px">${playcount} scrobbles · ${artistCount} artists</div>
            </div>
            <a href="https://www.last.fm/user/${LASTFM_USERNAME}" target="_blank" rel="noopener" style="font-size:0.7rem;color:#5573f4;text-decoration:none;flex-shrink:0">View Profile</a>
          </div>
          <!-- Tracks -->
          <div style="flex:1;overflow:hidden">
            ${tracksHtml}
          </div>
        </div>
      `;
    }

    function loadLastfm() {
      const recentUrl = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USERNAME}&api_key=${LASTFM_API_KEY}&format=json&limit=5`;
      const infoUrl = `https://ws.audioscrobbler.com/2.0/?method=user.getInfo&user=${LASTFM_USERNAME}&api_key=${LASTFM_API_KEY}&format=json`;

      Promise.all([fetch(recentUrl).then(r => r.json()), fetch(infoUrl).then(r => r.json())])
        .then(([recent, info]) => {
          if (recent.recenttracks && recent.recenttracks.track && recent.recenttracks.track.length > 0) {
            renderLastfm(recent, info.user);
          } else {
            showError('lastfmWidget', 'No recent tracks');
          }
        })
        .catch(() => showError('lastfmWidget', 'Unable to load'));
    }

    function renderValorant(data) {
      const el = document.getElementById('valorantWidget');
      const mmr = data.data;
      const rank = mmr.current_data?.currenttierpatched || 'Unranked';
      const rr = mmr.current_data?.ranking_in_tier || 0;
      const peak = mmr.highest_rank?.tierpatched || rank;
      const elo = mmr.current_data?.elo || 0;
      const rankIcon = RANK_ICONS[rank] || RANK_ICONS['Iron 1'];

      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px">
          <img src="${rankIcon}" style="width:56px;height:56px;object-fit:contain;flex-shrink:0" onerror="this.style.display='none'" />
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:0.95rem">${VALORANT_NAME}#${VALORANT_TAG}</div>
            <div style="font-size:0.85rem;color:#9CA3AF;margin-top:2px">${rank}</div>
            <div style="font-size:0.75rem;color:#6B7280;margin-top:1px">${rr} RR · ELO ${elo}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:0.7rem;color:#6B7280">Peak</div>
            <div style="font-size:0.8rem;color:#9CA3AF;font-weight:500">${peak}</div>
          </div>
        </div>
        <a href="https://tracker.gg/valorant/profile/riot/${VALORANT_NAME}%23${VALORANT_TAG}/overview" target="_blank" rel="noopener" style="display:block;text-align:center;padding:4px;font-size:0.75rem;color:#5573f4;text-decoration:none;border-top:1px solid rgba(255,255,255,0.05)">View on Tracker.gg</a>
      `;
    }

    function loadValorant() {
      const regions = ['ap', 'na', 'eu', 'kr'];
      let found = false;

      function tryRegion(idx) {
        if (idx >= regions.length || found) return;
        const region = regions[idx];
        fetch(`https://api.henrikdev.xyz/valorant/v2/mmr/${region}/${VALORANT_NAME}/${VALORANT_TAG}`, {
          headers: { 'Authorization': VALORANT_KEY }
        })
        .then(r => {
          if (!r.ok) throw new Error('not found');
          return r.json();
        })
        .then(d => {
          if (d && d.data && !found) {
            found = true;
            renderValorant(d);
          }
        })
        .catch(() => tryRegion(idx + 1));
      }

      tryRegion(0);
    }

    // ========== HELPER ==========
    function showError(widgetId, msg) {
      const el = document.getElementById(widgetId);
      if (!el) return;
      const hasImg = el.querySelector('img');
      if (hasImg) {
        el.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;width:100%"><p style="font-size:0.85rem;opacity:0.5">${msg}</p></div>`;
      } else {
        el.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;padding:12px;width:100%"><p style="font-size:0.85rem;opacity:0.5">${msg}</p></div>`;
      }
    }

    loadWeather();
    loadLastfm();
    loadValorant();
