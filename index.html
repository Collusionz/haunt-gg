<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>home</title>
  <meta name="description" content="personal website" />
  <meta name="theme-color" content="#5573f4" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { satoshi: ['"Satoshi"', 'sans-serif'] } } }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: 'Satoshi', sans-serif; background: #000; color: #ccd8ec; min-height: 100vh; overflow-x: hidden; }
    .enter-overlay { position: fixed; inset: 0; z-index: 50; cursor: pointer; transition: opacity 0.6s ease, visibility 0.6s ease; }
    .enter-overlay.hidden-overlay { opacity: 0; visibility: hidden; pointer-events: none; }
    .enter-overlay .bg { position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .enter-overlay .text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 2.25rem; font-weight: 500; letter-spacing: 0.05em; }
    .profile-card { background: rgba(218,220,247,0); background-clip: padding-box; color: #ccd8ec; border: 2px solid rgba(110,184,236,0.13); border-radius: 44px; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); position: relative; }
    .profile-card-inner { border-radius: 42px; overflow: hidden; }
    .username-glow { color: #4764ec; text-shadow: 0 0 16.5px #4764ec; }
    .haunt-line { height: 1px; background-image: linear-gradient(to right, transparent, currentColor, transparent); filter: drop-shadow(0 0 3.5px currentColor); }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .anim-reveal { animation: fadeInUp 0.5s ease forwards; }
    .side-nav { position: fixed; left: 24px; top: 50%; z-index: 50; transform: translateY(-50%); display: none; flex-direction: column; gap: 12px; }
    @media (min-width: 768px) { .side-nav { display: flex; } }
    .side-nav a { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 300; letter-spacing: 0.05em; text-decoration: none; transition: color 0.2s; color: rgba(255,255,255,0.4); }
    .side-nav a:hover { color: rgba(255,255,255,0.7); }
    .side-nav a.active { color: #fff; }
    .side-nav a .nav-line { height: 1px; width: 8px; background: rgba(255,255,255,0.4); transition: all 0.2s; flex-shrink: 0; }
    .side-nav a:hover .nav-line { width: 12px; background: rgba(255,255,255,0.7); }
    .side-nav a.active .nav-line { width: 16px; background: #fff; }
    .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; border-top: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; }
    @media (min-width: 768px) { .mobile-nav { display: none; } }
    .mobile-nav a { flex: 1; text-align: center; padding: 12px 4px; font-size: 0.625rem; font-weight: 300; letter-spacing: 0.05em; color: rgba(255,255,255,0.4); text-decoration: none; transition: color 0.2s; }
    .mobile-nav a.active, .mobile-nav a:hover { color: #fff; }
    @media (min-width: 768px) { #mainContent { padding-left: 80px; } }
  </style>
</head>
<body class="min-h-full flex flex-col">
  <nav class="side-nav">
    <a href="/" class="active"><span class="nav-line"></span>Home</a>
    <a href="/valorant"><span class="nav-line"></span>Valorant</a>
    <a href="/projects"><span class="nav-line"></span>Projects</a>
    <a href="/widgets"><span class="nav-line"></span>Widgets</a>
  </nav>
  <nav class="mobile-nav">
    <a href="/" class="active">Home</a>
    <a href="/valorant">Valorant</a>
    <a href="/projects">Projects</a>
    <a href="/widgets">Widgets</a>
  </nav>
  <div class="dark contents">
    <audio id="bgAudio" src="https://r2.haunt.gg/audio/2dc1a59a-12c4-4850-9bdd-439432d9cabd.mp3" preload="auto" loop></audio>
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" style="background-color:#000000">
      <video id="bgVideo" src="https://r2.haunt.gg/background/5f034507-f610-4968-98f3-b614bb7b4339.mp4#t=0.001" loop muted playsinline preload="auto" class="absolute inset-0 w-full h-full object-cover"></video>
    </div>

    <main class="relative flex w-full flex-col items-center text-white font-satoshi" id="mainContent">
      <section class="relative flex min-h-screen w-full items-center justify-center py-12 px-4">
        <div class="relative flex w-full flex-col items-stretch gap-3" style="max-width:48rem">
          <div class="profile-card relative z-10 w-full px-8 py-8 will-change-transform anim-reveal">
            <div class="profile-card-inner" style="margin:-2rem;margin-bottom:0;padding:2rem;padding-bottom:0">
              <div class="-mx-8 -mt-8 overflow-hidden" style="border-top-left-radius:42px;border-top-right-radius:42px">
                <div class="relative w-full overflow-hidden" style="height:160px;mask-image:linear-gradient(to top,transparent 0%,black 100%);-webkit-mask-image:linear-gradient(to top,transparent 0%,black 100%)">
                  <img alt="Banner" src="https://r2.haunt.gg/banner/ac6de097-e866-496a-8bc2-93c3f1e5bcef.jpg" class="absolute inset-0 w-full h-full object-cover" />
                </div>
              </div>
              <div class="flex flex-col gap-4">
                <div class="flex items-start gap-4">
                  <div class="relative shrink-0 -mt-[60px]" style="width:120px;height:120px">
                    <img alt="Avatar" src="https://r2.haunt.gg/avatar/850dc5e6-1cc7-420a-9358-213ee2b2277a.jpg" class="w-full h-full object-cover rounded-full" />
                    <img alt="" src="https://r2.haunt.gg/decorations/pandoran_seas.png" class="pointer-events-none absolute top-1/2 left-1/2 z-10 w-full h-full object-contain" style="transform:translate(-50%,-50%) scale(1.2)" />
                  </div>
                  <div class="flex min-w-0 flex-1 flex-col items-start justify-center gap-1" style="height:120px;margin-top:-60px">
                    <div class="flex w-full flex-wrap items-center gap-x-3 gap-y-1">
                      <span class="relative inline-block font-semibold tracking-tight text-3xl username-glow">collusionz</span>
                    </div>
                  </div>
                </div>
                <div class="break-words w-full text-center text-xl" style="color:#5573f4">
                  <div class="haunt-line mx-auto my-3 h-px w-48 max-w-full"></div>
                  <p class="mb-2 leading-relaxed last:mb-0"><strong class="font-semibold">Im cz / collusionz :)<br/>I'm 16</strong> <span class="rounded-sm px-1 py-0.5 text-[0.95em] font-medium" style="background-color:color-mix(in oklab,currentColor 12%,transparent)">in 9 months</span></p>
                  <div class="haunt-line mx-auto my-3 h-px w-48 max-w-full"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <footer class="relative flex w-full justify-center py-8 px-4 text-white">
        <p class="text-sm opacity-40">made with care</p>
      </footer>
    </main>

    <div role="button" tabindex="0" aria-label="enter" class="enter-overlay" id="enterOverlay">
      <div class="bg"></div>
      <div class="text"><div class="flex flex-col items-center"><div class="break-words px-6 text-center text-4xl font-medium tracking-wide"><p class="mb-2 leading-relaxed last:mb-0">enter</p></div></div></div>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('enterOverlay');
    const bgVideo = document.getElementById('bgVideo');
    const bgAudio = document.getElementById('bgAudio');

    function dismissOverlay() {
      overlay.classList.add('hidden-overlay');
      bgVideo.play().catch(() => {});
      bgAudio.volume = 0.3;
      bgAudio.play().catch(() => {});
    }
    if (window.location.hash) {
      dismissOverlay();
    } else {
      overlay.addEventListener('click', dismissOverlay);
      overlay.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') dismissOverlay(); });
    }
  </script>
</body>
</html>
