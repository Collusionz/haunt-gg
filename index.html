  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;padding:0;font-family:'Satoshi',sans-serif;background:#000;color:#ccd8ec;min-height:100vh;overflow-x:hidden;transition:background 0.3s,color 0.3s}
    body.light{background:#f5f5f5;color:#1a1a2e}
    .enter-overlay{position:fixed;inset:0;z-index:50;cursor:pointer;transition:opacity 0.6s ease,visibility 0.6s ease}
    .enter-overlay.hidden-overlay{opacity:0;visibility:hidden;pointer-events:none}
    .enter-overlay .bg{position:absolute;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
    .enter-overlay .text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.25rem;font-weight:500;letter-spacing:0.05em}
    .profile-card{background:rgba(218,220,247,0);background-clip:padding-box;color:#ccd8ec;border:2px solid rgba(110,184,236,0.13);border-radius:44px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);position:relative;transition:border-color 0.3s}
    body.light .profile-card{border-color:rgba(85,115,244,0.2);background:rgba(255,255,255,0.8);color:#1a1a2e}
    .profile-card-inner{border-radius:42px;overflow:hidden}
    .username-glow{color:#4764ec;text-shadow:0 0 16.5px #4764ec;animation:glowPulse 3s ease-in-out infinite}
    @keyframes glowPulse{0%,100%{text-shadow:0 0 16.5px #4764ec}50%{text-shadow:0 0 30px #4764ec,0 0 60px rgba(71,100,236,0.3)}}
    .haunt-line{height:1px;background-image:linear-gradient(to right,transparent,currentColor,transparent);filter:drop-shadow(0 0 3.5px currentColor)}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .anim-reveal{animation:fadeInUp 0.5s ease forwards}
    .anim-delay-1{animation-delay:0.1s;opacity:0}
    .anim-delay-2{animation-delay:0.2s;opacity:0}
    .anim-delay-3{animation-delay:0.3s;opacity:0}
    .side-nav{position:fixed;left:24px;top:50%;z-index:50;transform:translateY(-50%);display:none;flex-direction:column;gap:12px}
    @media(min-width:768px){.side-nav{display:flex}}
    .side-nav a{display:flex;align-items:center;gap:8px;font-size:0.75rem;font-weight:300;letter-spacing:0.05em;text-decoration:none;transition:color 0.2s;color:rgba(255,255,255,0.4)}
    .side-nav a:hover{color:rgba(255,255,255,0.7)}
    .side-nav a.active{color:#fff}
    .side-nav a .nav-line{height:1px;width:8px;background:rgba(255,255,255,0.4);transition:all 0.2s;flex-shrink:0}
    .side-nav a:hover .nav-line{width:12px;background:rgba(255,255,255,0.7)}
    .side-nav a.active .nav-line{width:16px;background:#fff}
    .mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;border-top:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex}
    @media(min-width:768px){.mobile-nav{display:none}}
    .mobile-nav a{flex:1;text-align:center;padding:12px 4px;font-size:0.625rem;font-weight:300;letter-spacing:0.05em;color:rgba(255,255,255,0.4);text-decoration:none;transition:color 0.2s}
    .mobile-nav a.active,.mobile-nav a:hover{color:#fff}
    @media(min-width:768px){#mainContent{padding-left:80px}}
    .scroll-progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,#5573f4,#4764ec);z-index:100;transition:width 0.1s}
    #cursorSpotlight{position:fixed;width:300px;height:300px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(71,100,236,0.08) 0%,transparent 70%);transform:translate(-50%,-50%);transition:opacity 0.3s}
    .cursor-trail{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:2;transition:opacity 0.5s}
    .theme-toggle{position:fixed;top:20px;right:20px;z-index:50;width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;transition:all 0.3s}
    .theme-toggle:hover{background:rgba(255,255,255,0.1);transform:rotate(30deg)}
    body.light .theme-toggle{border-color:rgba(0,0,0,0.15);background:rgba(0,0,0,0.05);color:#1a1a2e}
    .typing-cursor{display:inline-block;width:2px;height:1em;background:#5573f4;margin-left:2px;animation:blink 1s step-end infinite;vertical-align:text-bottom}
    @keyframes blink{50%{opacity:0}}
    .avatar-ring{position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;animation:ringRotate 4s linear infinite}
    @keyframes ringRotate{0%{border-color:rgba(71,100,236,0.5)}25%{border-color:rgba(85,115,244,0.5)}50%{border-color:rgba(71,100,236,0.5)}75%{border-color:rgba(85,115,244,0.5)}}
    .stat-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:0.7rem;font-weight:500;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(8px);transition:all 0.2s}
    .stat-badge:hover{background:rgba(255,255,255,0.1);transform:translateY(-1px)}
    body.light .stat-badge{background:rgba(0,0,0,0.03);border-color:rgba(0,0,0,0.1)}
    .social-icon{display:inline-flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;border-radius:50%;border:2px solid rgba(110,184,236,0.13);backdrop-filter:blur(5px);color:#ccd8ec;transition:all 0.3s;text-decoration:none}
    .social-icon:hover{background:rgba(255,255,255,0.08);color:#fff;transform:translateY(-3px) scale(1.1);box-shadow:0 4px 15px rgba(71,100,236,0.3)}
    body.light .social-icon{border-color:rgba(85,115,244,0.2);color:#1a1a2e}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);padding:8px 20px;border-radius:12px;background:rgba(71,100,236,0.9);color:#fff;font-size:0.8rem;font-weight:500;backdrop-filter:blur(8px);z-index:200;opacity:0;transition:all 0.3s;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .confetti{position:fixed;pointer-events:none;z-index:200}
  </style>
</head>

    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" style="background-color:#000">

                    <img alt="" src="https://r2.haunt.gg/decorations/pandoran_seas.png" class="pointer-events-none absolute top-1/2 left-1/2 z-20 w-full h-full object-contain" style="transform:translate(-50%,-50%) scale(1.2)" />

  <script>
    // ========== ENTER OVERLAY ==========
    const overlay=document.getElementById('enterOverlay'),bgVideo=document.getElementById('bgVideo'),bgAudio=document.getElementById('bgAudio');
    function dismissOverlay(){overlay.classList.add('hidden-overlay');bgVideo.play().catch(()=>{});bgAudio.volume=0.3;bgAudio.play().catch(()=>{})}
    if(window.location.hash){dismissOverlay()}else{overlay.addEventListener('click',dismissOverlay);overlay.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')dismissOverlay()})}

    // ========== THEME TOGGLE ==========
    const themeToggle=document.getElementById('themeToggle');
    const savedTheme=localStorage.getItem('theme')||'dark';
    if(savedTheme==='light'){document.body.classList.add('light');themeToggle.textContent='☾'}
    themeToggle.addEventListener('click',()=>{
      document.body.classList.toggle('light');
      const isLight=document.body.classList.contains('light');
      themeToggle.textContent=isLight?'☾':'☀';
      localStorage.setItem('theme',isLight?'light':'dark');
    });

    // ========== SCROLL PROGRESS ==========
    window.addEventListener('scroll',()=>{
      const h=document.documentElement.scrollHeight-window.innerHeight;
      document.getElementById('scrollProgress').style.width=h>0?(window.scrollY/h*100)+'%':'0';
    });

    // ========== CURSOR SPOTLIGHT ==========
    const spotlight=document.getElementById('cursorSpotlight');
    document.addEventListener('mousemove',e=>{spotlight.style.left=e.clientX+'px';spotlight.style.top=e.clientY+'px'});

    // ========== CURSOR TRAIL ==========
    const trailColors=['#5573f4','#4764ec','#ff4466','#23A55A','#F0B232'];
    let trailIdx=0;
    document.addEventListener('mousemove',e=>{
      const t=document.createElement('div');
      t.className='cursor-trail';
      t.style.left=e.clientX+'px';t.style.top=e.clientY+'px';
      t.style.background=trailColors[trailIdx%trailColors.length];
      t.style.opacity='0.6';
      document.body.appendChild(t);
      setTimeout(()=>{t.style.opacity='0'},50);
      setTimeout(()=>t.remove(),500);
      trailIdx++;
    });

    // ========== GREETING (Singapore time) ==========
    function sgHour(){const parts=new Date().toLocaleTimeString('en-US',{timeZone:'Asia/Singapore',hour:'numeric',hour12:false});return parseInt(parts,10)%24}
    function getGreeting(){const h=sgHour();if(h<12)return'Good morning ☀️';if(h<17)return'Good afternoon 🌤️';if(h<21)return'Good evening 🌙';return'Late night 🦉'}
    document.getElementById('greetingBadge').textContent=getGreeting();
    setTimeout(()=>document.getElementById('greetingBadge').style.opacity='1',200);

    // ========== TYPING ANIMATION ==========
    const typingPhrases=['building cool stuff','playing valorant','listening to music','coding at 3am','exploring new things','grinding ranked','hanging out on discord'];
    try{const extra=JSON.parse(localStorage.getItem('vaultPhrases')||'[]');if(Array.isArray(extra)&&extra.length)typingPhrases.push(...extra)}catch(e){}
    const typingEl=document.getElementById('typingText');
    let phraseIdx=0,charIdx=0,isDeleting=false;
    function typeLoop(){
      const current=typingPhrases[phraseIdx];
      if(!isDeleting){
        typingEl.innerHTML=current.substring(0,charIdx+1)+'<span class="typing-cursor"></span>';
        charIdx++;
        if(charIdx===current.length){isDeleting=true;setTimeout(typeLoop,2000);return}
        setTimeout(typeLoop,80+Math.random()*40);
      }else{
        typingEl.innerHTML=current.substring(0,charIdx)+'<span class="typing-cursor"></span>';
        charIdx--;
        if(charIdx<0){isDeleting=false;charIdx=0;phraseIdx=(phraseIdx+1)%typingPhrases.length;setTimeout(typeLoop,500);return}
        setTimeout(typeLoop,40);
      }
    }
    typeLoop();

    // ========== AGE COUNTER (ticks in real-time) ==========
    const birthDate=new Date('2010-03-15');
    function updateAge(){
      const now=new Date();
      const diff=now-birthDate;
      const years=Math.floor(diff/(365.25*24*60*60*1000));
      const months=Math.floor((diff%(365.25*24*60*60*1000))/(30.44*24*60*60*1000));
      document.getElementById('ageCounter').textContent=years;
      document.getElementById('ageSubtext').textContent=`${months} months`;
    }
    updateAge();setInterval(updateAge,60000);

    // ========== SOCIAL LINKS ==========
    const socials=[
      {icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>',link:'https://discord.com/users/704140288716701737',label:'Discord'},
      {icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>',link:'https://github.com/Collusionz',label:'GitHub'},
      {icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>',link:'https://twitter.com/',label:'Twitter'},
    ];
    document.getElementById('socialLinks').innerHTML=socials.map(s=>`<a href="${s.link}" target="_blank" rel="noopener" class="social-icon" title="${s.label}">${s.icon}</a>`).join('');

    // ========== KONAMI CODE ==========
    const konami=[38,38,40,40,37,39,37,39,66,65];
    let konamiIdx=0;
    document.addEventListener('keydown',e=>{
      if(e.keyCode===konami[konamiIdx]){konamiIdx++;if(konamiIdx===konami.length){konamiIdx=0;triggerEasterEgg()}}else{konamiIdx=0}
    });
    function triggerEasterEgg(){
      showToast('🎮 Easter egg found!');
      for(let i=0;i<50;i++){
        const c=document.createElement('div');
        c.className='confetti';
        c.style.cssText=`left:${Math.random()*100}vw;top:-10px;width:${Math.random()*8+4}px;height:${Math.random()*8+4}px;background:${trailColors[i%trailColors.length]};border-radius:${Math.random()>0.5?'50%':'2px'};transform:rotate(${Math.random()*360}deg)`;
        document.body.appendChild(c);
        const dur=Math.random()*2000+1500;
        c.animate([{top:'-10px',opacity:1},{top:'100vh',opacity:0}],{duration:dur,easing:'ease-out'});
        setTimeout(()=>c.remove(),dur);
      }
    }

    // ========== TOAST ==========
    function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

    // ========== COPY USERNAME ==========
    document.getElementById('usernameText').addEventListener('click',()=>{
      navigator.clipboard.writeText('collusionz').then(()=>showToast('Username copied!')).catch(()=>{});
    });
    document.getElementById('usernameText').style.cursor='pointer';
    document.getElementById('usernameText').title='Click to copy';

    // ========== PARTICLES ON AVATAR HOVER ==========
    const avatarWrap=document.getElementById('avatarWrap');
    avatarWrap.addEventListener('mouseenter',()=>{
      for(let i=0;i<8;i++){
        const p=document.createElement('div');
        const angle=(i/8)*Math.PI*2;
        const dist=60+Math.random()*30;
        p.style.cssText=`position:absolute;width:4px;height:4px;border-radius:50%;background:${trailColors[i%trailColors.length]};left:50%;top:50%;z-index:30;pointer-events:none`;
        avatarWrap.appendChild(p);
        p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px) scale(0)`,opacity:0}],{duration:600,easing:'ease-out'});
        setTimeout(()=>p.remove(),600);
      }
    });
  </script>
</body>
</html>
