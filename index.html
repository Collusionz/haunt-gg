      { role:"Moderator", title:"Rivals Media", desc:"Assisted in posting people!", img:"https://r2.haunt.gg/project/53c9fd80-34e1-4533-9d87-80996c5d7e8b.webp", link:"https://discord.gg/rivalstv" },

      { role:"Manager", title:"Holds", desc:"Responsible for overseeing moderators, managing channels and roles, handling tickets and escalations, and ensuring smooth server operations.", img:"https://r2.haunt.gg/project/39e6974b-73ce-481e-9314-66037a4fa619.webp", link:"https://discord.gg/yjv5qbg2fN" },
      { role:"Server Manager", title:"Arko's Kingdom", desc:"Collaborated with other staff members to improve server policies, refine rules, and implement better moderation practices.", img:"https://r2.haunt.gg/project/28089fe2-3035-4d8a-a6bd-74bb3bab0c2f.webp", link:"https://discord.gg/jZyGa3dJA" },
    ];

    function renderProjects() {
      const grid = document.getElementById('projectsGrid');
      grid.innerHTML = projects.map((p, i) => {
        const isWide = (i === 2);
        return `<div class="min-w-0 relative min-h-0 ${isWide ? 'sm:col-span-2' : 'col-span-1'}">
          <a href="${p.link}" target="_blank" rel="noreferrer noopener" class="block size-full">
            <div class="group relative h-full affiliation-card profile-card">
              <div class="relative size-full overflow-hidden" style="border-radius:42px">
                <div class="affiliation-bg" style="background-image:url(${p.img})"></div>
                <div class="affiliation-gradient"></div>
                <div class="absolute start-3 top-3 flex flex-wrap gap-1 sm:gap-2 z-10">
                  <span class="btn-badge">${p.role}</span>
                </div>
                <div class="absolute inset-x-0 bottom-0 p-3 sm:p-4 z-10">
                  <h3 class="mb-1 font-bold text-lg sm:text-xl" style="color:#ccd8ec">${p.title}</h3>
                  <p class="line-clamp-2 text-base" style="color:rgba(204,216,236,0.9)">${p.desc}</p>
                </div>
              </div>
            </div>
          </a>
        </div>`;
      }).join('');
    }

    // ========== DISCORD WIDGET (Lanyard) ==========
    function statusColor(status) {
      return { online: '#23A55A', idle: '#F0B232', dnd: '#F23F43', offline: '#80848E' }[status] || '#80848E';
    }

    function renderDiscord(data) {
      const el = document.getElementById('discordWidget');
      const u = data.discord_user;
      const avatarUrl = u.avatar
        ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=128`
        : `https://cdn.discordapp.com/embed/avatars/${parseInt(u.discriminator || '0') % 5}.png`;
      const status = data.discord_status || 'offline';
      const activities = data.activities || [];
      const spotify = data.listening_to_spotify ? data.spotify : null;

      let detail = '';
      if (spotify) {
        detail = `<span style="color:#1DB954">Listening to</span> <strong>${spotify.track}</strong>`;
        if (spotify.artist) detail += ` <span style="opacity:0.6">by ${spotify.artist}</span>`;
      } else if (activities.length > 0 && activities[0].name !== 'Custom Status') {
        const a = activities[0];
        detail = a.details || a.state || a.name;
      } else if (activities.length > 0 && activities[0].state) {
        detail = activities[0].state;
      } else {
        detail = `<span style="opacity:0.5">${status.charAt(0).toUpperCase() + status.slice(1)}</span>`;
      }

      let activityImg = '';
      if (spotify && spotify.album_art_url) {
        activityImg = `<img src="${spotify.album_art_url}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0" />`;
      } else if (activities.length > 0 && activities[0].assets?.large_image) {
        let img = activities[0].assets.large_image;
        if (img.startsWith('mp:external')) img = 'https://media.discordapp.net/external/' + img.replace('mp:external/', '');
        activityImg = `<img src="${img}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0" />`;
      }

      el.innerHTML = `
        <img src="${avatarUrl}" style="width:74px;height:74px;border-radius:14px;object-fit:cover;flex-shrink:0" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" />
        <div style="display:flex;flex-direction:column;min-width:0;flex:1">
          <div style="font-weight:600;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.global_name || u.username}</div>
          <div style="font-size:0.8rem;color:#9CA3AF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">${detail}</div>
        </div>
        ${activityImg}
        <div style="width:10px;height:10px;border-radius:50%;flex-shrink:0;background:${statusColor(status)}"></div>
      `;
    }

    function loadDiscord() {
      fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`)
        .then(r => r.json())
        .then(d => { if (d.success) renderDiscord(d.data); else showError('discordWidget', 'Join discord.gg/lanyard to enable'); })
        .catch(() => showError('discordWidget', 'Unable to load'));
    }

    // ========== ROBLOX WIDGET ==========
    function renderRoblox(userId, username, displayName, avatarUrl) {
      const el = document.getElementById('robloxWidget');
      el.innerHTML = `
        <img src="${avatarUrl}" style="width:74px;height:74px;border-radius:14px;object-fit:cover;flex-shrink:0" onerror="this.style.background='#333'" />
        <div style="display:flex;flex-direction:column;min-width:0;flex:1">
          <div style="font-weight:600;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${displayName || username}</div>
          <div style="font-size:0.8rem;color:#9CA3AF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">@${username}</div>
          <a href="https://roblox.com/users/${userId}/profile" target="_blank" rel="noopener" style="font-size:0.75rem;color:#5573f4;text-decoration:none;margin-top:2px">View Profile</a>
        </div>
      `;
    }

    function loadRoblox() {
      // Step 1: Resolve username to userId
      fetch('https://users.roblox.com/v1/usernames/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usernames: [ROBLOX_USERNAME] })
      })
      .then(r => r.json())
      .then(d => {
        if (d.data && d.data.length > 0) {
          const user = d.data[0];
          // Step 2: Get avatar thumbnail
          fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${user.id}&size=150x150&format=Png&isCircular=false`)
            .then(r => r.json())
            .then(t => {
              const thumb = t.data && t.data[0] ? t.data[0].imageUrl : '';
              renderRoblox(user.id, user.name, user.displayName, thumb);
            })
            .catch(() => renderRoblox(user.id, user.name, user.displayName, ''));
        } else {
          showError('robloxWidget', 'User not found');
        }
      })
      .catch(() => showError('robloxWidget', 'Unable to load'));
    }

    // ========== TIME WIDGET ==========
    function renderTime() {
      const el = document.getElementById('timeWidget');
      const now = new Date();
      const options = { timeZone: TIMEZONE, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      const dateOpts = { timeZone: TIMEZONE, weekday: 'short', month: 'short', day: 'numeric' };
      const timeStr = now.toLocaleTimeString('en-US', options);
      const dateStr = now.toLocaleDateString('en-US', dateOpts);

      // Analog clock
      const tzParts = now.toLocaleTimeString('en-US', { timeZone: TIMEZONE, hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false });
      const [h, m, s] = tzParts.split(':').map(Number);
      const hourDeg = ((h % 12) + m / 60) * 30;
      const minDeg = (m + s / 60) * 6;
      const secDeg = s * 6;

      let marks = '';
      for (let i = 0; i < 12; i++) {
        marks += `<div class="clock-mark" style="transform:translateX(-50%) rotate(${i * 30}deg);transform-origin:bottom center;top:4px;left:calc(50% - 1px);position:absolute;width:2px;height:6px;background:rgba(255,255,255,0.3)"></div>`;
      }

      el.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div class="clock-face">
            <div class="clock-center"></div>
            <div class="clock-hand clock-hour" style="transform:translateX(-50%) rotate(${hourDeg}deg)"></div>
            <div class="clock-hand clock-minute" style="transform:translateX(-50%) rotate(${minDeg}deg)"></div>
            <div class="clock-hand clock-second" style="transform:translateX(-50%) rotate(${secDeg}deg)"></div>
          </div>
          <div style="text-align:center">
            <div style="font-size:1.1rem;font-weight:600">${timeStr}</div>
            <div style="font-size:0.75rem;color:#9CA3AF">${dateStr}</div>
            <div style="font-size:0.7rem;color:#6B7280">${TIMEZONE}</div>
          </div>
        </div>
      `;
    }

    function loadTime() {
      renderTime();
      setInterval(renderTime, 1000);
    }

    // ========== WEATHER WIDGET (Open-Meteo) ==========
    const WMO_CODES = {
      0: ['Clear', '☀️'], 1: ['Mainly Clear', '🌤️'], 2: ['Partly Cloudy', '⛅'], 3: ['Overcast', '☁️'],
      45: ['Fog', '🌫️'], 48: ['Rime Fog', '🌫️'],
      51: ['Light Drizzle', '🌦️'], 53: ['Drizzle', '🌦️'], 55: ['Heavy Drizzle', '🌧️'],
      61: ['Light Rain', '🌧️'], 63: ['Rain', '🌧️'], 65: ['Heavy Rain', '🌧️'],
      71: ['Light Snow', '🌨️'], 73: ['Snow', '🌨️'], 75: ['Heavy Snow', '❄️'],
      80: ['Light Showers', '🌦️'], 81: ['Showers', '🌧️'], 82: ['Heavy Showers', '🌧️'],
      95: ['Thunderstorm', '⛈️'], 96: ['Thunderstorm + Hail', '⛈️'], 99: ['Heavy T-storm + Hail', '⛈️']
    };

    function renderWeather(data, city) {
      const el = document.getElementById('weatherWidget');
      const temp = Math.round(data.current.temperature_2m);
      const feelsLike = Math.round(data.current_apparent?.temperature_2m || temp);
      const humidity = data.current.relative_humidity_2m;
      const wind = Math.round(data.current.wind_speed_10m);
      const code = data.current.weather_code;
      const [label, icon] = WMO_CODES[code] || ['Unknown', '❓'];

      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;width:100%">
          <div style="font-size:2rem;flex-shrink:0">${icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:1.5rem;font-weight:700">${temp}°C</div>
            <div style="font-size:0.8rem;color:#9CA3AF">${label} · Feels like ${feelsLike}°C</div>
            <div style="font-size:0.7rem;color:#6B7280;margin-top:2px">💧 ${humidity}% · 💨 ${wind} km/h</div>
          </div>
          <div style="font-size:0.7rem;color:#6B7280;text-align:right;flex-shrink:0">${city}</div>
        </div>
      `;
    }

    function loadWeather() {
      // Use browser geolocation
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            const { latitude, longitude } = pos.coords;
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&current_apparent=temperature_2m&timezone=auto`)
              .then(r => r.json())
              .then(d => {
                // Try to get city name from reverse geocoding
                fetch(`https://geocoding-api.open-meteo.com/v1/search?name=&latitude=${latitude}&longitude=${longitude}&count=1`)
                  .then(r => r.json())
                  .then(g => {
                    const city = g.results && g.results[0] ? g.results[0].name : 'Your Location';
                    renderWeather(d, city);
                  })
                  .catch(() => renderWeather(d, 'Your Location'));
              })
              .catch(() => showError('weatherWidget', 'Unable to load weather'));
          },
          () => {
            // Fallback to Singapore
            fetch('https://api.open-meteo.com/v1/forecast?latitude=1.29&longitude=103.85&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&current_apparent=temperature_2m&timezone=Asia/Singapore')
              .then(r => r.json())
              .then(d => renderWeather(d, 'Singapore'))
              .catch(() => showError('weatherWidget', 'Unable to load weather'));
          },
          { timeout: 5000 }
        );
      } else {
        // Fallback to Singapore
        fetch('https://api.open-meteo.com/v1/forecast?latitude=1.29&longitude=103.85&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&current_apparent=temperature_2m&timezone=Asia/Singapore')
          .then(r => r.json())
          .then(d => renderWeather(d, 'Singapore'))
          .catch(() => showError('weatherWidget', 'Unable to load weather'));
      }
    }

    // ========== LAST.FM WIDGET ==========
    function renderLastfm(data) {
      const el = document.getElementById('lastfmWidget');
      const track = data.recenttracks.track[0];
      if (!track) { showError('lastfmWidget', 'No recent tracks'); return; }

      const isNowPlaying = track['@attr'] && track['@attr'].nowplaying;
      const img = track.image && track.image.length > 0 ? track.image[track.image.length - 1]['#text'] : '';
      const artist = track.artist['#text'];
      const name = track.name;
      const album = track.album ? track.album['#text'] : '';

      el.innerHTML = `
        <img src="${img}" style="width:74px;height:74px;border-radius:14px;object-fit:cover;flex-shrink:0" onerror="this.style.background='#333'" />
        <div style="display:flex;flex-direction:column;min-width:0;flex:1">
          <div style="font-size:0.7rem;color:${isNowPlaying ? '#1DB954' : '#9CA3AF'};font-weight:${isNowPlaying ? '600' : '400'};margin-bottom:2px">${isNowPlaying ? '● NOW PLAYING' : 'Last scrobbled'}</div>
          <div style="font-weight:600;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>
          <div style="font-size:0.8rem;color:#9CA3AF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${artist}</div>
          ${album ? `<div style="font-size:0.7rem;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px">${album}</div>` : ''}
        </div>
      `;
    }

    function loadLastfm() {
      fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USERNAME}&api_key=${LASTFM_API_KEY}&format=json&limit=1`)
        .then(r => r.json())
        .then(d => {
          if (d.recenttracks && d.recenttracks.track && d.recenttracks.track.length > 0) {
            renderLastfm(d);
          } else {
            showError('lastfmWidget', 'No recent tracks');
          }
        })
        .catch(() => showError('lastfmWidget', 'Unable to load'));
    }

    // ========== VALORANT WIDGET ==========
    function renderValorantStatic() {
      const el = document.getElementById('valorantWidget');
      el.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center">
          <div style="font-size:1.5rem">🎯</div>
          <div style="font-weight:600;font-size:0.95rem">${VALORANT_NAME}#${VALORANT_TAG}</div>
          <div style="font-size:0.8rem;color:#9CA3AF">Valorant</div>
          <a href="https://tracker.gg/valorant/profile/riot/${VALORANT_NAME}%23${VALORANT_TAG}/overview" target="_blank" rel="noopener" style="font-size:0.75rem;color:#5573f4;text-decoration:none">View on Tracker.gg</a>
        </div>
      `;
    }

    function loadValorant() {
      // Try Henrik API (requires API key - show static fallback)
      renderValorantStatic();
    }

    // ========== HELPER ==========
    function showError(widgetId, msg) {
      const el = document.getElementById(widgetId);
      if (!el) return;
      const hasImg = el.querySelector('img');
      if (hasImg) {
        el.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;width:100%"><p style="font-size:0.85rem;opacity:0.5">${msg}</p></div>`;
      } else {
        el.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;padding:12px;width:100%"><p style="font-size:0.85rem;opacity:0.5">${msg}</p></div>`;
      }
    }

    // ========== INIT ==========
    renderProjects();
    loadDiscord();
    loadRoblox();
    loadTime();
    loadWeather();
    loadLastfm();
    loadValorant();
  </script>
</body>
