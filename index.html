<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>home</title>
  <meta name="description" content="personal website" />
  <meta name="theme-color" content="#5573f4" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { satoshi: ['"Satoshi"', 'sans-serif'] } } }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: 'Satoshi', sans-serif; background: #000; color: #ccd8ec; min-height: 100vh; overflow-x: hidden; }
    .enter-overlay { position: fixed; inset: 0; z-index: 50; cursor: pointer; transition: opacity 0.6s ease, visibility 0.6s ease; }
    .enter-overlay.hidden-overlay { opacity: 0; visibility: hidden; pointer-events: none; }
    .enter-overlay .bg { position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .enter-overlay .text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 2.25rem; font-weight: 500; letter-spacing: 0.05em; }
    .profile-card { background: rgba(218,220,247,0); background-clip: padding-box; color: #ccd8ec; border: 2px solid rgba(110,184,236,0.13); border-radius: 44px; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); position: relative; }
    .profile-card-inner { border-radius: 42px; overflow: hidden; }
    .widget-card { background: rgba(255,255,255,0.05); background-clip: padding-box; color: #fff; border: 2px solid rgba(255,255,255,0.1); border-radius: 25px; }
    .username-glow { color: #4764ec; text-shadow: 0 0 16.5px #4764ec; }
    .haunt-line { height: 1px; background-image: linear-gradient(to right, transparent, currentColor, transparent); filter: drop-shadow(0 0 3.5px currentColor); }
    .affiliation-card { position: relative; height: 100%; overflow: hidden; border-radius: 42px; cursor: pointer; transition: transform 0.5s ease; }
    .affiliation-card:hover .affiliation-bg { transform: scale(1.05); }
    .affiliation-bg { position: absolute; inset: 0; background-size: cover; background-position: center; background-color: rgba(10,10,10,0.8); transition: transform 0.5s ease; }
    .affiliation-gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.4), transparent); }
    .btn-badge { background-color: rgba(218,220,247,0.1); border: 1px solid rgba(110,184,236,0.23); border-radius: 26px; color: #ccd8ec; padding: 0.25rem 0.625rem; font-size: 0.875rem; font-weight: 500; backdrop-filter: blur(12px); display: inline-flex; align-items: center; gap: 0.25rem; }
    .like-btn, .dislike-btn { color: #c1c8ec; transition: color 0.2s ease; cursor: pointer; background: none; border: none; padding: 4px; }
    .like-btn:hover, .dislike-btn:hover { color: #fff; }
    .like-btn.active { color: #ff4466; }
    .dislike-btn.active { color: #4488ff; }
    .social-link { display: inline-flex; align-items: center; justify-content: center; width: 3rem; height: 3rem; border-radius: 50%; border: 2px solid rgba(110,184,236,0.13); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); color: #ccd8ec; transition: background 0.2s, color 0.2s, transform 0.2s; text-decoration: none; }
    .social-link:hover { background: rgba(255,255,255,0.08); color: #fff; transform: translateY(-2px); }
    .skeleton { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; background: rgba(255,255,255,0.1); border-radius: 0.375rem; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .scroll-fade-in { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .scroll-fade-in.visible { opacity: 1; transform: translateY(0); }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .anim-reveal { animation: fadeInUp 0.5s ease forwards; }
    .anim-delay-1 { animation-delay: 0.1s; opacity: 0; }
    .anim-delay-2 { animation-delay: 0.2s; opacity: 0; }
    .anim-delay-3 { animation-delay: 0.3s; opacity: 0; }
    .anim-delay-4 { animation-delay: 0.4s; opacity: 0; }
    .anim-delay-5 { animation-delay: 0.5s; opacity: 0; }
    .widget-discord { padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
    .widget-discord .avatar { width: 74px; height: 74px; border-radius: 14px; object-fit: cover; flex-shrink: 0; }
    .widget-discord .info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .widget-discord .info .name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .widget-discord .info .status { font-size: 0.8rem; color: #9CA3AF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .widget-discord .info .detail { font-size: 0.75rem; color: #6B7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .widget-discord .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .widget-discord .activity-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .widget-roblox { padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
    .widget-roblox .avatar { width: 74px; height: 74px; border-radius: 14px; object-fit: cover; flex-shrink: 0; }
    .widget-roblox .info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .widget-roblox .info .name { font-weight: 600; font-size: 0.95rem; }
    .widget-roblox .info .detail { font-size: 0.8rem; color: #9CA3AF; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>

  <script>
    // === PROJECTS DATA ===
    const projects = [
      { role:"Adminstrator", title:"Rivals Competitive League", desc:"Leads the charge on moderation and addressing fair-play violations.", img:"https://r2.haunt.gg/project/6b89fdd9-b736-4367-b87c-80df070d0c2f.webp", link:"https://discord.gg/BuDr9eYt9m" },
      { role:"Tester", title:"DUELISTS", desc:"Tasked with proposing ideas and ticket managing.", img:"https://r2.haunt.gg/project/029feceb-48da-4dd8-98e6-d22de74d1688.webp", link:"https://discord.gg/tGSH8649xR" },
      { role:"Moderator", title:"ALCHEMY", desc:"Handled moderation tickets, resolving user reports, while keeping chat engaged.", img:"https://r2.haunt.gg/project/d90e60cf-dab9-4f16-8164-98e3913f1b4c.webp", link:"https://discord.gg/sFFSJAQhBs" },

      { role:"Moderator", title:"Fang", desc:"Played a key role in establishing server structure, rules, and staff systems, while supporting moderation operations and helping manage and grow the community.", img:"https://r2.haunt.gg/project/108d058f-8092-4cff-83a1-c533188c53aa.webp", link:"https://discord.gg/vXuZwWT2F4" },
      { role:"Moderator", title:"Xorf's", desc:"Responsible for enforcing rules, monitoring chats, handling reports, resolving conflicts, and maintaining a safe and friendly community.", img:"https://r2.haunt.gg/project/28e02af9-af3e-4190-908c-d64ae165df91.webp", link:"https://discord.gg/xedkKawmxZ" },
      { role:"Manager", title:"Holds", desc:"Responsible for overseeing moderators, managing channels and roles, handling tickets and escalations, and ensuring smooth server operations.", img:"https://r2.haunt.gg/project/39e6974b-73ce-481e-9314-66037a4fa619.webp", link:"https://discord.gg/yjv5qbg2fN" },
      { role:"Server Manager", title:"Arko's Kingdom", desc:"Collaborated with other staff members to improve server policies, refine rules, and implement better moderation practices.", img:"https://r2.haunt.gg/project/28089fe2-3035-4d8a-a6bd-74bb3bab0c2f.webp", link:"https://discord.gg/jZyGa3dJA" },
    ];

    function renderProjects() {
      const grid = document.getElementById('projectsGrid');
      grid.innerHTML = projects.map((p, i) => {
        const isWide = (i === 2);
        return `<div class="min-w-0 relative min-h-0 ${isWide ? 'sm:col-span-2' : 'col-span-1'}">
          <a href="${p.link}" target="_blank" rel="noreferrer noopener" class="block size-full">
            <div class="group relative h-full affiliation-card profile-card">
              <div class="relative size-full overflow-hidden" style="border-radius:42px">
                <div class="affiliation-bg" style="background-image:url(${p.img})"></div>
                <div class="affiliation-gradient"></div>
                <div class="absolute start-3 top-3 flex flex-wrap gap-1 sm:gap-2 z-10">
                  <span class="btn-badge">${p.role}</span>
                </div>
                <div class="absolute inset-x-0 bottom-0 p-3 sm:p-4 z-10">
                  <h3 class="mb-1 font-bold text-lg sm:text-xl" style="color:#ccd8ec">${p.title}</h3>
                  <p class="line-clamp-2 text-base" style="color:rgba(204,216,236,0.9)">${p.desc}</p>
                </div>
              </div>
            </div>
          </a>
        </div>`;
      }).join('');
    }

    // === DISCORD PRESENCE (Lanyard API) ===
    const DISCORD_USER_ID = '704140288716701737';

    function statusColor(status) {
      const c = { online: '#23A55A', idle: '#F0B232', dnd: '#F23F43', offline: '#80848E' };
      return c[status] || c.offline;
    }

    function renderDiscord(data) {
      const el = document.getElementById('discordWidget');
      const u = data.discord_user;
      const avatarUrl = u.avatar ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=128` : `https://cdn.discordapp.com/embed/avatars/${parseInt(u.discriminator || u.username) % 5}.png`;
      const status = data.discord_status || 'offline';
      const activities = data.activities || [];
      const spotify = data.spotify;

      let detail = '';
      if (spotify && activities.some(a => a.type === 1)) {
        detail = `Listening to <strong>${spotify.track || 'Spotify'}</strong> by ${spotify.artist || ''}`;
      } else if (activities.length > 0 && activities[0].name) {
        detail = activities[0].details || activities[0].name;
      } else {
        detail = status.charAt(0).toUpperCase() + status.slice(1);
      }

      let activityImg = '';
      if (activities.length > 0 && activities[0].assets?.large_image) {
        let img = activities[0].assets.large_image;
        if (img.startsWith('mp:external')) img = 'https://media.discordapp.net/external/' + img.replace('mp:external/', '');
        activityImg = `<img src="${img}" class="activity-img" />`;
      }

      el.innerHTML = `
        <img src="${avatarUrl}" class="avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" />
        <div class="info">
          <div class="name">${u.global_name || u.username}</div>
          <div class="status">${detail}</div>
          ${activities.length > 0 && activities[0].state ? `<div class="detail">${activities[0].state}</div>` : ''}
        </div>
        ${activityImg}
        <div class="status-dot" style="background-color:${statusColor(status)}"></div>
      `;
    }

    function loadDiscord() {
      fetch(`https://api.lanyard.xyz/v1/users/${DISCORD_USER_ID}`)
        .then(r => r.json())
        .then(d => { if (d.success) renderDiscord(d.data); else showError('discordWidget'); })
        .catch(() => showError('discordWidget'));
    }

    // === ROBLOX WIDGET ===
    const ROBLOX_USERNAME = 'tripp_Thebest05';

    function renderRoblox(user) {
      const el = document.getElementById('robloxWidget');
      const thumbUrl = user.avatarUrl || user.thumbnailUrl || `https://www.roblox.com/headshot/image?userId=${user.id}&width=150&height=150&format=png`;
      el.innerHTML = `
        <img src="${thumbUrl}" class="avatar" onerror="this.style.background='#333';this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23333%22 width=%22100%22 height=%22100%22/></svg>'" />
        <div class="info">
          <div class="name">${user.displayName || user.name}</div>
          <div class="detail">@${user.name}</div>
        </div>
      `;
    }

    function loadRoblox() {
      fetch(`https://api.vchome.cloud/roblox/user/${ROBLOX_USERNAME}`)
        .then(r => r.json())
        .then(d => {
          if (d && d.id) {
            renderRoblox({ id: d.id, name: d.name || ROBLOX_USERNAME, displayName: d.displayName || d.name || ROBLOX_USERNAME, avatarUrl: d.avatarUrl });
          } else {
            renderRoblox({ id: 0, name: ROBLOX_USERNAME, displayName: ROBLOX_USERNAME });
          }
        })
        .catch(() => {
          // Fallback: use Roblox avatar API
          fetch(`https://api.roblox.com/users/get-by-username?username=${ROBLOX_USERNAME}`)
            .then(r => r.json())
            .then(d => {
              if (d.Id) {
                renderRoblox({ id: d.Id, name: d.Name || ROBLOX_USERNAME, displayName: d.Name || ROBLOX_USERNAME, avatarUrl: `https://www.roblox.com/headshot/image?userId=${d.Id}&width=150&height=150&format=png` });
              } else {
                renderRoblox({ id: 0, name: ROBLOX_USERNAME, displayName: ROBLOX_USERNAME });
              }
            })
            .catch(() => renderRoblox({ id: 0, name: ROBLOX_USERNAME, displayName: ROBLOX_USERNAME }));
        });
    }

    // === WIDE WIDGET (Currently playing / status) ===
    function loadWideWidget() {
      const el = document.getElementById('wideWidget');
      // Show current time
      function updateTime() {
        const now = new Date();
        el.innerHTML = `<div class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-4 h-4" style="color:#9CA3AF"><path fill="currentColor" d="M12 22C6.5 22 2 17.5 2 12S6.5 2 12 2s10 4.5 10 10-4.5 10-10 10m0-2c4.4 0 8-3.6 8-8s-3.6-8-8-8-8 3.6-8 8 3.6 8 8 8m.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7z"/></svg><span style="color:#9CA3AF;font-size:0.875rem">${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</span></div>`;
      }
      updateTime();
      setInterval(updateTime, 1000);
    }

    function showError(widgetId) {
      const el = document.getElementById(widgetId);
      el.innerHTML = `<div class="relative flex h-full flex-col justify-center items-center px-4 py-6"><p class="text-sm opacity-40">Unable to load</p></div>`;
    }

    // === INIT ===
    const overlay = document.getElementById('enterOverlay');
    const bgVideo = document.getElementById('bgVideo');
    function dismissOverlay() { overlay.classList.add('hidden-overlay'); bgVideo.play().catch(()=>{}); }
    overlay.addEventListener('click', dismissOverlay);
    overlay.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') dismissOverlay(); });

    const observer = new IntersectionObserver(entries => { entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }); }, { threshold: 0.1 });
    document.querySelectorAll('.scroll-fade-in').forEach(el => observer.observe(el));

    renderProjects();
    loadDiscord();
    loadRoblox();
    loadWideWidget();
  </script>
</body>
</html>
