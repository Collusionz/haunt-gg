  <script>
// ========== BACKGROUND ==========
    const bgVideo=document.getElementById('bgVideo');
    bgVideo.play().catch(()=>{});

    // ========== VIEW COUNTER (global via sync.js) ==========
    function renderVisitCount(n){
      const el=document.getElementById('visitCount');
      if(!el)return;
      el.innerHTML='<span class="vc-num">0</span> '+(n===1?'view':'views');
      el.style.opacity='1';
      const num=el.querySelector('.vc-num');
      const step=Math.max(1,Math.round(n/22));
      let cur=0;
      const iv=setInterval(()=>{
        cur=Math.min(n,cur+step);
        num.textContent=cur;
        if(cur>=n)clearInterval(iv);
      },24);
    }
    try {
      const KEY='hauntVisits';
      const cached=parseInt(localStorage.getItem(KEY)||'0',10)||0;
      renderVisitCount(cached+1);
      if(window.Syn)Syn.addVisit(n=>{if(typeof n==='number')renderVisitCount(n)});
    }catch(e){};

    // ========== THEME TOGGLE ==========
    const themeToggle=document.getElementById('themeToggle');
    const savedTheme=localStorage.getItem('theme')||'dark';
    if(savedTheme==='light'){document.body.classList.add('light');themeToggle.textContent='☾'}
    themeToggle.addEventListener('click',()=>{
      document.body.classList.toggle('light');
      const isLight=document.body.classList.contains('light');
      themeToggle.textContent=isLight?'☾':'☀';
      localStorage.setItem('theme',isLight?'light':'dark');
    });

    // ========== SCROLL PROGRESS ==========
    window.addEventListener('scroll',()=>{
      const h=document.documentElement.scrollHeight-window.innerHeight;
      document.getElementById('scrollProgress').style.width=h>0?(window.scrollY/h*100)+'%':'0';
    });

    // ========== CURSOR SPOTLIGHT ==========
    const spotlight=document.getElementById('cursorSpotlight');
    document.addEventListener('mousemove',e=>{spotlight.style.left=e.clientX+'px';spotlight.style.top=e.clientY+'px'});

    // ========== CURSOR TRAIL ==========
    const trailColors=['#5573f4','#4764ec','#ff4466','#23A55A','#F0B232'];
    let trailIdx=0;
    document.addEventListener('mousemove',e=>{
      const t=document.createElement('div');
      t.className='cursor-trail';
      t.style.left=e.clientX+'px';t.style.top=e.clientY+'px';
      t.style.background=trailColors[trailIdx%trailColors.length];
      t.style.opacity='0.6';
      document.body.appendChild(t);
      setTimeout(()=>{t.style.opacity='0'},50);
      setTimeout(()=>t.remove(),500);
      trailIdx++;
    });

    // ========== GREETING (Singapore time) ==========
    function sgHour(){const parts=new Date().toLocaleTimeString('en-US',{timeZone:'Asia/Singapore',hour:'numeric',hour12:false});return parseInt(parts,10)%24}
    function getGreeting(){const h=sgHour();if(h<12)return'Good morning ☀️';if(h<17)return'Good afternoon 🌤️';if(h<21)return'Good evening 🌙';return'Late night 🦉'}
    document.getElementById('greetingBadge').textContent=getGreeting();
    setTimeout(()=>document.getElementById('greetingBadge').style.opacity='1',200);

// ========== TYPING ANIMATION (statuses from vault, synced) ==========
    let typingPhrases=[],typingGen=0;
    function startTyping(){
      const gen=++typingGen;
      const typingEl=document.getElementById('typingText');
      if(!typingEl)return;
      try{const extra=JSON.parse(localStorage.getItem('vaultPhrases')||'[]');typingPhrases=Array.isArray(extra)?extra.filter(x=>typeof x==='string'&&x.trim()):[]}catch(e){typingPhrases=[]}
      if(!typingPhrases.length){typingEl.style.display='none';return}
      typingEl.style.display='';
      let phraseIdx=0,charIdx=0,isDeleting=false;
      function typeLoop(){
        if(gen!==typingGen)return;
        const current=typingPhrases[phraseIdx];
        if(!isDeleting){
          typingEl.innerHTML=current.substring(0,charIdx+1)+'<span class="typing-cursor"></span>';
          charIdx++;
          if(charIdx===current.length){isDeleting=true;setTimeout(typeLoop,2000);return}
          setTimeout(typeLoop,80+Math.random()*40);
        }else{
          typingEl.innerHTML=current.substring(0,charIdx)+'<span class="typing-cursor"></span>';
          charIdx--;
          if(charIdx<0){isDeleting=false;charIdx=0;phraseIdx=(phraseIdx+1)%typingPhrases.length;setTimeout(typeLoop,500);return}
          setTimeout(typeLoop,40);
        }
      }
      typeLoop();
    }
    startTyping();
    if(window.Syn)Syn.pull('phrases',v=>{if(v&&Syn.apply('vaultPhrases',v))startTyping()});

// ========== AGE COUNTER (discord-style unix timestamp) ==========
const BIRTHDAY_EPOCH=1812038400;
function discordRelative(ep){
  const diff=ep*1000-Date.now();
  if(diff<=0)return 'today';
  const s=Math.floor(diff/1000);
  const units=[['year',31536000],['month',2592000],['week',604800],['day',86400],['hour',3600],['minute',60],['second',1]];
  for(const[u,t] of units){
    if(s>=t){
      const v=Math.max(1,Math.round(s/t));
      return 'in '+v+(v===1?(' '+u):(' '+u+'s'));
    }
  }
  return 'in a moment';
}
function discordDate(ep){
  return new Date(ep*1000).toLocaleDateString('en-GB'); // dd/mm/yyyy
}
function discordFull(ep){
  return new Date(ep*1000).toLocaleString('en-GB',{timeZone:'Asia/Singapore',weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
}
function updateCountdown(){
  const txt=discordRelative(BIRTHDAY_EPOCH);
  const els=[document.getElementById('countdown'),document.getElementById('countdownBirthday')];
  els.forEach(el=>{if(el){el.textContent=txt;el.title=discordFull(BIRTHDAY_EPOCH)+'\n<t:'+BIRTHDAY_EPOCH+':d>  <t:'+BIRTHDAY_EPOCH+':R>'}});
}
updateCountdown();setInterval(updateCountdown,1000);

// ========== KONAMI CODE ==========
    const konami=[38,38,40,40,37,39,37,39,66,65];
    let konamiIdx=0;
    document.addEventListener('keydown',e=>{
      if(e.keyCode===konami[konamiIdx]){konamiIdx++;if(konamiIdx===konami.length){konamiIdx=0;triggerEasterEgg()}}else{konamiIdx=0}
    });
    function triggerEasterEgg(){
      showToast('🎮 Easter egg found!');
      for(let i=0;i<50;i++){
        const c=document.createElement('div');
        c.className='confetti';
        c.style.cssText=`left:${Math.random()*100}vw;top:-10px;width:${Math.random()*8+4}px;height:${Math.random()*8+4}px;background:${trailColors[i%trailColors.length]};border-radius:${Math.random()>0.5?'50%':'2px'};transform:rotate(${Math.random()*360}deg)`;
        document.body.appendChild(c);
        const dur=Math.random()*2000+1500;
        c.animate([{top:'-10px',opacity:1},{top:'100vh',opacity:0}],{duration:dur,easing:'ease-out'});
        setTimeout(()=>c.remove(),dur);
      }
    }

    // ========== TOAST ==========
    function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

    // ========== COPY USERNAME ==========
    document.getElementById('usernameText').addEventListener('click',()=>{
      navigator.clipboard.writeText('collusionz').then(()=>showToast('Username copied!')).catch(()=>{});
    });
    document.getElementById('usernameText').style.cursor='pointer';
    document.getElementById('usernameText').title='Click to copy';

    // ========== PARTICLES ON AVATAR HOVER ==========
    const avatarWrap=document.getElementById('avatarWrap');
    avatarWrap.addEventListener('mouseenter',()=>{
      for(let i=0;i<8;i++){
        const p=document.createElement('div');
        const angle=(i/8)*Math.PI*2;
        const dist=60+Math.random()*30;
        p.style.cssText=`position:absolute;width:4px;height:4px;border-radius:50%;background:${trailColors[i%trailColors.length]};left:50%;top:50%;z-index:30;pointer-events:none`;
        avatarWrap.appendChild(p);
        p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px) scale(0)`,opacity:0}],{duration:600,easing:'ease-out'});
setTimeout(()=>p.remove(),600);
      }
    });



    // ========== GUESTBOOK (overlay) ==========
  </script>

  <script>
    try{var _vb=localStorage.getItem('vaultBg');if(_vb){document.querySelectorAll('video').forEach(function(v){var s=v.querySelectorAll('source');for(var i=0;i<s.length;i++)s[i].remove();v.src=_vb;v.load()})}}catch(e){}
  </script>
<script src="/bg.js" defer></script>
<script src="/guestbook.js" defer></script>
</body>
