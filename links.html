<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Links | home</title>
  <script src="/sync.js"></script>
  <meta name="theme-color" content="#5573f4"/>
  <link rel="preconnect" href="https://api.fontshare.com"/>
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin/>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{satoshi:['"Satoshi"','sans-serif']}}}}</script>
  <style>
*,*::before,*::after{box-sizing:border-box}
    *,*::before,*::after{cursor:url('cursor.png') 17 17,auto!important}
    body{margin:0;padding:0;font-family:'Satoshi',sans-serif;background:#000;color:#ccd8ec;min-height:100vh;overflow-x:hidden}
    .widget-card{background:rgba(255,255,255,0.05);color:#fff;border:2px solid rgba(255,255,255,0.1);border-radius:25px}
    .side-nav{position:fixed;left:24px;top:50%;z-index:50;transform:translateY(-50%);display:none;flex-direction:column;gap:12px}
    @media(min-width:768px){.side-nav{display:flex}}
    .side-nav a{display:flex;align-items:center;gap:8px;font-size:0.75rem;font-weight:300;letter-spacing:0.05em;text-decoration:none;transition:color 0.2s;color:rgba(255,255,255,0.4)}
    .side-nav a:hover{color:rgba(255,255,255,0.7)}
    .side-nav a.active{color:#fff}
    .side-nav a .nav-line{height:1px;width:8px;background:rgba(255,255,255,0.4);transition:all 0.2s;flex-shrink:0}
    .side-nav a:hover .nav-line{width:12px;background:rgba(255,255,255,0.7)}
    .side-nav a.active .nav-line{width:16px;background:#fff}
    .mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;border-top:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex}
    @media(min-width:768px){.mobile-nav{display:none}}
    .mobile-nav a{flex:1;text-align:center;padding:12px 4px;font-size:0.625rem;font-weight:300;letter-spacing:0.05em;color:rgba(255,255,255,0.4);text-decoration:none;transition:color 0.2s}
    .mobile-nav a.active,.mobile-nav a:hover{color:#fff}
    @media(min-width:768px){#mainContent{padding-left:80px}}
    .links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .links-grid a{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:18px;background:rgba(255,255,255,0.045);border:2px solid rgba(255,255,255,0.1);color:#fff;text-decoration:none;transition:border-color 0.25s,transform 0.25s,background 0.25s,box-shadow 0.25s;position:relative;overflow:hidden}
    .links-grid a::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 18% 0%,rgba(85,115,244,0.20),transparent 55%);opacity:0;transition:opacity 0.25s;pointer-events:none}
    .links-grid a:hover{border-color:rgba(85,115,244,0.55);background:rgba(85,115,244,0.08);transform:translateY(-3px);box-shadow:0 12px 32px rgba(85,115,244,0.16)}
    .links-grid a:hover::after{opacity:1}
    .links-grid .link-icon{width:54px;height:54px;border-radius:14px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#4764ec,#ff4466);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.1)}
    .links-grid .link-icon img,.links-grid .link-icon video{width:100%;height:100%;object-fit:cover;display:block}
    .links-grid .link-arrow{opacity:0.3;font-size:0.95rem;transition:opacity 0.2s,transform 0.2s;flex-shrink:0;position:relative;z-index:1}
    .links-grid a:hover .link-arrow{opacity:1;transform:translateX(3px)}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .anim-reveal{animation:fadeInUp 0.5s ease forwards}
    .anim-delay-1{animation-delay:0.1s;opacity:0}
    .anim-delay-2{animation-delay:0.2s;opacity:0}
    .anim-delay-3{animation-delay:0.3s;opacity:0}
    .anim-delay-4{animation-delay:0.4s;opacity:0}
    .anim-delay-5{animation-delay:0.5s;opacity:0}
  </style>
</head>
<body class="min-h-full flex flex-col">
  <!-- Desktop Side Nav -->
  <nav class="side-nav">
<a href="/"><span class="nav-line"></span>Home</a>
    <a href="/music"><span class="nav-line"></span>Music</a>
    <a href="/gallery"><span class="nav-line"></span>Gallery</a>
    <a href="/projects"><span class="nav-line"></span>Projects</a>
    <a href="/acquaintances"><span class="nav-line"></span>Acquaintances</a>

    <a href="/widgets"><span class="nav-line"></span>Widgets</a>
    <a href="/valorant"><span class="nav-line"></span>Valorant</a>
    <a href="/links" class="active"><span class="nav-line"></span>Links</a>
    
  </nav>
  <!-- Mobile Bottom Nav -->
  <nav class="mobile-nav">
    <a href="/">Home</a>
    <a href="/music">Music</a>
    <a href="/gallery">Gallery</a>
    <a href="/projects">Projects</a>
    <a href="/acquaintances">Acquaintances</a>
    
    <a href="/widgets">Widgets</a>
    <a href="/valorant">Valorant</a>
    <a href="/links" class="active">Links</a>
    
  </nav>
  <div class="dark contents">
    <!-- Video Background -->
<div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" style="background-color:#000;background-image:radial-gradient(circle at 20% 15%,rgba(255,70,85,0.16),transparent 55%),radial-gradient(circle at 80% 10%,rgba(85,115,244,0.12),transparent 55%),radial-gradient(circle at 50% 90%,rgba(255,255,255,0.03),transparent 60%)"></div>

    <main class="relative flex w-full flex-col items-center text-white font-satoshi" id="mainContent">
      <!-- Header -->
      <section class="relative flex w-full flex-col items-center px-4" style="padding-top:48px;padding-bottom:16px">
        <div class="w-full max-w-3xl anim-reveal">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
            <div style="width:4px;height:32px;background:#ff4655;border-radius:2px"></div>
            <h1 style="font-size:1.75rem;font-weight:700;color:#fff;margin:0">Links</h1>
          </div>
          <p style="font-size:0.9rem;color:#9CA3AF;margin:0 0 0 16px">my socials and places to find me</p>
        </div>
      </section>

      <!-- Links -->
      <section class="relative flex w-full flex-col items-center px-4" style="padding-top:16px;padding-bottom:48px">
        <div class="w-full max-w-3xl anim-reveal anim-delay-1">
          <div class="links-grid" id="linksGrid"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    function renderLinks(){
      var grid=document.getElementById('linksGrid');
      if(!grid)return;
      var list=[];
      try{list=JSON.parse(localStorage.getItem('vaultLinks')||'[]')}catch(e){}
      if(!list.length){
        grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:48px 0;color:#6B7280;font-size:0.9rem">no links yet</div>';
        return;
      }
      function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
      function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return String(u||'').replace(/^https?:\/\//i,'').replace(/\/.*$/,'').replace(/^www\./,'')}}
      grid.innerHTML=list.map(function(l){
        var name=String(l.name||'Untitled'),url=String(l.url||'#'),icon=l.icon||'';
        var iconHtml;
        if(icon.indexOf('data:video')===0){
          iconHtml='<video src="'+esc(icon)+'" muted loop playsinline preload="auto"></video>';
        }else if(icon){
          iconHtml='<img src="'+esc(icon)+'" loading="lazy" decoding="async" onerror="this.remove()"/>';
        }else{
          iconHtml='<img src="https://www.google.com/s2/favicons?domain='+esc(host(url))+'&sz=64" loading="lazy" decoding="async" onerror="this.remove()"/>';
        }
        return '<a href="'+esc(url)+'" target="_blank" rel="noreferrer noopener">'+
          '<div class="link-icon">'+iconHtml+'</div>'+
          '<div style="flex:1;min-width:0;position:relative;z-index:1">'+
            '<div style="font-size:1rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(name)+'</div>'+
            '<div style="font-size:0.75rem;color:#6B7280;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(host(url)||url)+'</div>'+
          '</div>'+
          '<span class="link-arrow">↗</span>'+
        '</a>';
      }).join('');
    }
    renderLinks();
    if(window.Syn)Syn.pull('links',v=>{if(v&&Syn.apply('vaultLinks',v))renderLinks()});
  </script>

  <script>
    try{var _vb=localStorage.getItem('vaultBg');if(_vb){document.querySelectorAll('video').forEach(function(v){var s=v.querySelectorAll('source');for(var i=0;i<s.length;i++)s[i].remove();v.src=_vb;v.load()})}}catch(e){}
  </script>
<script src="/bg.js" defer></script>
<script src="/guestbook.js" defer></script>
</body>
</html>
