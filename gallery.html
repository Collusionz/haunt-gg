<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
  <style>
* {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    *, *::before, *::after { cursor: url('cursor.png') 17 17, auto !important; }

    body {
      font-family: 'Satoshi', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Video Background */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.3;
    }

    /* Sidebar */
    .side-nav{position:fixed;left:24px;top:50%;z-index:50;transform:translateY(-50%);display:none;flex-direction:column;gap:12px}
    @media(min-width:768px){.side-nav{display:flex}}
    .side-nav a{display:flex;align-items:center;gap:8px;font-size:0.75rem;font-weight:300;letter-spacing:0.05em;text-decoration:none;transition:color 0.2s;color:rgba(255,255,255,0.4)}
    .side-nav a:hover{color:rgba(255,255,255,0.7)}
    .side-nav a.active{color:#fff}
    .side-nav a .nav-line{height:1px;width:8px;background:rgba(255,255,255,0.4);transition:all 0.2s;flex-shrink:0}
    .side-nav a:hover .nav-line{width:12px;background:rgba(255,255,255,0.7)}
    .side-nav a.active .nav-line{width:16px;background:#fff}
    .mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;border-top:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex}
    @media(min-width:768px){.mobile-nav{display:none}}
    .mobile-nav a{flex:1;text-align:center;padding:12px 4px;font-size:0.625rem;font-weight:300;letter-spacing:0.05em;color:rgba(255,255,255,0.4);text-decoration:none;transition:color 0.2s}
    .mobile-nav a.active,.mobile-nav a:hover{color:#fff}

/* Main Content */
    .main-content {
      padding-bottom: 90px;
      padding: 40px 40px 100px 120px;
      min-height: 100vh;
    }

    /* Header */
    .section-header {
      margin-bottom: 40px;
    }

    .accent-bar {
      width: 50px;
      height: 4px;
      background: linear-gradient(90deg, #5573f4, #4764ec);
      border-radius: 2px;
      margin-bottom: 16px;
    }

    .section-header h1 {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .section-header p {
      color: rgba(255, 255, 255, 0.4);
      font-size: 16px;
      font-weight: 400;
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 20px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.6);
      font-family: 'Satoshi', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .filter-btn:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.8);
    }

    .filter-btn.active {
      background: rgba(71, 100, 236, 0.25);
      border-color: rgba(71, 100, 236, 0.5);
      color: #fff;
    }

    /* Photo Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .gallery-card {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.35s ease;
    }

    .gallery-card:hover {
      transform: scale(1.03);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .gallery-card .card-bg {
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease;
    }

    .gallery-card:hover .card-bg {
      transform: scale(1.08);
    }

    .gallery-card .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 50%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .gallery-card:hover .card-overlay {
      opacity: 1;
    }

    .card-overlay h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-overlay span {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 400;
    }

    .gallery-card.hidden-card {
      display: none;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-content {
      position: relative;
      max-width: 80vw;
      max-height: 80vh;
      border-radius: 20px;
      overflow: hidden;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .lightbox.active .lightbox-content {
      transform: scale(1);
    }

    .lightbox-content .lb-bg {
      width: 70vw;
      height: 50vh;
      border-radius: 20px;
    }

    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .lightbox-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 28px;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
      border-radius: 0 0 20px 20px;
    }

    .lightbox-info h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .lightbox-info span {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
    }

/* Footer */
    .site-footer {
      margin-left: 120px;
      padding: 30px 40px;
      text-align: center;
      color: rgba(255, 255, 255, 0.25);
      font-size: 13px;
      font-weight: 400;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .main-content {
        padding: 24px 20px 100px;
      }
      .gallery-grid {
        grid-template-columns: 1fr;
      }
      .section-header h1 {
        font-size: 30px;
      }
      .lightbox-content .lb-bg {
        width: 90vw;
        height: 60vh;
      }
    }
    @keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .anim-reveal{animation:fadeInUp 0.5s ease forwards}
    .anim-delay-1{animation-delay:0.1s;opacity:0}
    .anim-delay-2{animation-delay:0.2s;opacity:0}
    .anim-delay-3{animation-delay:0.3s;opacity:0}
    .anim-delay-4{animation-delay:0.4s;opacity:0}
    .anim-delay-5{animation-delay:0.5s;opacity:0}
  </style>
</head>
<body>

  <!-- Video Background -->
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="/audio/background.mp4#t=0.001" type="video/mp4">
  </video>

  <!-- Sidebar -->
<nav class="side-nav">
    <a href="/"><span class="nav-line"></span>Home</a>
    <a href="/music"><span class="nav-line"></span>Music</a>
    <a href="/gallery" class="active"><span class="nav-line"></span>Gallery</a>
    <a href="/projects"><span class="nav-line"></span>Projects</a>
    <a href="/acquaintances"><span class="nav-line"></span>Acquaintances</a>

    <a href="/widgets"><span class="nav-line"></span>Widgets</a>
    <a href="/valorant"><span class="nav-line"></span>Valorant</a>
    <a href="/links"><span class="nav-line"></span>Links</a>
    
  </nav>
  <nav class="mobile-nav">
    <a href="/">Home</a>
    <a href="/music">Music</a>
    <a href="/gallery" class="active">Gallery</a>
    <a href="/projects">Projects</a>
    <a href="/acquaintances">Acquaintances</a>
    
    <a href="/widgets">Widgets</a>
    <a href="/valorant">Valorant</a>
    <a href="/links">Links</a>
    
  </nav>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Header -->
    <div class="section-header anim-reveal">
      <div class="accent-bar"></div>
      <h1>Gallery</h1>
      <p>moments and memories</p>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs anim-reveal anim-delay-1">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="screenshots">Screenshots</button>
      <button class="filter-btn" data-filter="art">Art</button>
      <button class="filter-btn" data-filter="irl">IRL</button>
      <button class="filter-btn" data-filter="memes">Memes</button>
    </div>

<!-- Photo Grid -->
    <div class="gallery-grid anim-reveal anim-delay-2">
    </div>
  </main>

  <script>
    (function(){
      var grid=document.querySelector('.gallery-grid');
      if(!grid)return;
      try{
        var items=JSON.parse(localStorage.getItem('vaultGallery')||'[]');
        var catMap={'screenshots':'Screenshots','art':'Art','irl':'IRL','memes':'Memes'};
items.forEach(function(it){
          var el=document.createElement('div');
          el.className='gallery-card';
          el.setAttribute('data-category',it.category||'screenshots');
          el.setAttribute('data-title',it.title||'Untitled');
          el.setAttribute('data-date',it.date||'');
          var bg='';
          if(it.img){
            bg='linear-gradient(rgba(0,0,0,0.05),rgba(0,0,0,0.2)), center / cover no-repeat, linear-gradient(135deg,'+(it.bg1||'#4764ec')+','+(it.bg2||'#ff4466')+')';
          }else{
            bg='linear-gradient(135deg,'+(it.bg1||'#4764ec')+','+(it.bg2||'#ff4466')+')';
          }
          var m0=(it.img||'');var isVid=m0.indexOf('data:video/')===0||/\.(mp4|webm|ogg)([?#]|$)/i.test(m0);
          var media;
          if(isVid){
            media='<video src="'+it.img+'" muted loop playsinline preload="auto" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0"></video>';
          }else{
            media='<img src="'+it.img+'" alt="'+it.title+'" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0" onerror="this.remove()"/>';
          }
          el.innerHTML='<div class="card-bg" style="background:'+bg+';width:100%;height:100%;position:relative">'+media+'</div><div class="card-overlay"><h3>'+(it.title||'Untitled')+'</h3><span>'+(it.date||'')+'</span></div>';
grid.appendChild(el);
        });
        if(!grid.children.length){grid.innerHTML='<p style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,0.35);padding:48px 0;font-size:0.9rem">nothing here yet</p>'}
      }catch(e){}
    })();
  </script>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="lightbox-content">
      <div class="lb-bg" id="lightboxBg"></div>
      <div class="lightbox-info">
        <h3 id="lightboxTitle"></h3>
        <span id="lightboxDate"></span>
      </div>
    </div>
  </div>

  <script>
    // Filter functionality
    const filterBtns = document.querySelectorAll('.filter-btn');
    const cards = document.querySelectorAll('.gallery-card');

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const filter = btn.dataset.filter;

        cards.forEach(card => {
          if (filter === 'all' || card.dataset.category === filter) {
            card.classList.remove('hidden-card');
          } else {
            card.classList.add('hidden-card');
          }
        });
      });
    });

    // Lightbox functionality
    const lightbox = document.getElementById('lightbox');
    const lightboxBg = document.getElementById('lightboxBg');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const lightboxDate = document.getElementById('lightboxDate');
    const lightboxClose = document.getElementById('lightboxClose');

cards.forEach(card => {
      card.addEventListener('click', () => {
        const bg = card.querySelector('.card-bg');
        const mediaEl = bg.querySelector('img, video');
        lightboxBg.innerHTML = '';
        if (mediaEl) {
          if (mediaEl.tagName === 'VIDEO') {
            const clone = mediaEl.cloneNode(false);
            clone.controls = true;
            clone.autoplay = true;
            clone.loop = true;
            clone.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;';
            lightboxBg.style.background = '#000';
            lightboxBg.appendChild(clone);
          } else {
            const clone = mediaEl.cloneNode(false);
            clone.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;';
            lightboxBg.style.background = 'linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.25))';
            lightboxBg.appendChild(clone);
          }
        } else {
          lightboxBg.style.background = bg.style.background;
        }
        lightboxTitle.textContent = card.dataset.title;
        lightboxDate.textContent = card.dataset.date;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    lightboxClose.addEventListener('click', closeLightbox);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeLightbox();
      }
    });

function closeLightbox() {
      const v=lightboxBg.querySelector('video');
      if(v){v.pause();v.removeAttribute('controls')}
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }
  </script>

  <script>
    try{var _vb=localStorage.getItem('vaultBg');if(_vb){document.querySelectorAll('video').forEach(function(v){var s=v.querySelectorAll('source');for(var i=0;i<s.length;i++)s[i].remove();v.src=_vb;v.load()})}}catch(e){}
  </script>
<script src="/bg.js" defer></script>
<script src="/guestbook.js" defer></script>
</body>
</html>
