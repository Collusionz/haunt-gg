    tailwind.config = {

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: 'Satoshi', sans-serif; background: #000; color: #ccd8ec; min-height: 100vh; overflow-x: hidden; }
    .profile-card { background: rgba(218,220,247,0); background-clip: padding-box; color: #ccd8ec; border: 2px solid rgba(110,184,236,0.13); border-radius: 44px; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); position: relative; }
    .affiliation-card { position: relative; height: 100%; overflow: hidden; border-radius: 42px; cursor: pointer; transition: transform 0.5s ease; }
    .affiliation-card:hover .affiliation-bg { transform: scale(1.05); }
    .affiliation-bg { position: absolute; inset: 0; background-size: cover; background-position: center; background-color: rgba(10,10,10,0.8); transition: transform 0.5s ease; }
    .affiliation-gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.4), transparent); }
    .btn-badge { background-color: rgba(218,220,247,0.1); border: 1px solid rgba(110,184,236,0.23); border-radius: 26px; color: #ccd8ec; padding: 0.25rem 0.625rem; font-size: 0.875rem; font-weight: 500; backdrop-filter: blur(12px); display: inline-flex; align-items: center; gap: 0.25rem; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .side-nav { position: fixed; left: 24px; top: 50%; z-index: 50; transform: translateY(-50%); display: none; flex-direction: column; gap: 12px; }
    @media (min-width: 768px) { .side-nav { display: flex; } }
    .side-nav a { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 300; letter-spacing: 0.05em; text-decoration: none; transition: color 0.2s; color: rgba(255,255,255,0.4); }
    .side-nav a:hover { color: rgba(255,255,255,0.7); }
    .side-nav a.active { color: #fff; }
    .side-nav a .nav-line { height: 1px; width: 8px; background: rgba(255,255,255,0.4); transition: all 0.2s; flex-shrink: 0; }
    .side-nav a:hover .nav-line { width: 12px; background: rgba(255,255,255,0.7); }
    .side-nav a.active .nav-line { width: 16px; background: #fff; }
    .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; border-top: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; }
    @media (min-width: 768px) { .mobile-nav { display: none; } }
    .mobile-nav a { flex: 1; text-align: center; padding: 12px 4px; font-size: 0.625rem; font-weight: 300; letter-spacing: 0.05em; color: rgba(255,255,255,0.4); text-decoration: none; transition: color 0.2s; }
    .mobile-nav a.active, .mobile-nav a:hover { color: #fff; }
    @media (min-width: 768px) { #mainContent { padding-left: 80px; } }
  </style>
</head>
<body class="min-h-full flex flex-col">
  <nav class="side-nav">

<a href="/about"><span class="nav-line"></span>About</a>

    <a href="/widgets"><span class="nav-line"></span>Widgets</a>
    <a href="/valorant"><span class="nav-line"></span>Valorant</a>
    <button data-gb style="background:none;border:0;padding:0;font-family:'Satoshi',sans-serif;display:flex;align-items:center;gap:8px;font-size:0.75rem;font-weight:300;letter-spacing:0.05em;text-decoration:none;transition:color 0.2s;color:rgba(255,255,255,0.4)"><span class="nav-line"></span>Guestbook</button>

    <a href="/valorant">Valorant</a>

  <div class="dark contents">
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" style="background-color:#000">
      <video src="https://r2.haunt.gg/background/5f034507-f610-4968-98f3-b614bb7b4339.mp4#t=0.001" loop muted playsinline preload="auto" class="absolute inset-0 w-full h-full object-cover" style="opacity:0.3"></video>
    </div>

    <main class="relative flex w-full flex-col items-center text-white font-satoshi" id="mainContent" style="padding-top:48px;padding-bottom:48px">
      <div class="flex w-full flex-col gap-3 max-w-5xl px-4">
        <header class="text-start">
          <div class="break-words text-2xl font-semibold" style="color:#f4f7f8"><p class="mb-2 leading-relaxed last:mb-0">Affiliations</p></div>
          <div class="break-words mt-1 text-sm" style="color:#e6f6f9"><p class="mb-2 leading-relaxed last:mb-0">Servers or projects i am actively involved in</p></div>
        </header>
        <div class="flex w-full flex-col gap-4">
          <div class="grid w-full grid-cols-1 gap-3 sm:grid-cols-2" style="grid-auto-rows:14rem" id="projectsGrid"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const projects=[
      {role:"Adminstrator",title:"Rivals Competitive League",desc:"Leads the charge on moderation and addressing fair-play violations.",img:"https://r2.haunt.gg/project/6b89fdd9-b736-4367-b87c-80df070d0c2f.webp",link:"https://discord.gg/BuDr9eYt9m"},
      {role:"Tester",title:"DUELISTS",desc:"Tasked with proposing ideas and ticket managing.",img:"https://r2.haunt.gg/project/029feceb-48da-4dd8-98e6-d22de74d1688.webp",link:"https://discord.gg/tGSH8649xR"},
      {role:"Moderator",title:"ALCHEMY",desc:"Handled moderation tickets, resolving user reports, while keeping chat engaged.",img:"https://r2.haunt.gg/project/d90e60cf-dab9-4f16-8164-98e3913f1b4c.webp",link:"https://discord.gg/sFFSJAQhBs"},
      {role:"Manager",title:"MRC",desc:"Oversaw moderation staff, enforced rules, managed channels and roles, handled reports, and ensured smooth daily server operations.",img:"https://r2.haunt.gg/project/d4b066e4-b243-4802-a52d-24a1d9427267.png",link:"https://discord.gg/BTdpkjQQbu"},
      {role:"Tester",title:"lu studiosT",desc:"Roblox game tester responsible for playtesting new features, identifying bugs and exploits, providing feedback on gameplay balance, and reporting issues to developers before public release.",img:"https://r2.haunt.gg/project/a7ed631c-c7f0-46f2-992c-150f4d3da784.webp",link:"https://discord.gg/GXgSEXB3tY"},
      {role:"Moderator",title:"Muz Crew",desc:"Managed support ticket systems, reviewed applications, handled user reports, enforced rules, and helped maintain an organized and safe community.",img:"https://r2.haunt.gg/project/f90a300b-af49-4b59-952a-2fc472a77302.webp",link:"https://discord.gg/wQwkDQrhNa"},
      {role:"Manager",title:"Rivals Competitive Hangout",desc:"Handled moderation tickets, reviewed user reports, managed rule enforcement, and helped keep the server active and well-organized.",img:"https://r2.haunt.gg/project/be758949-e82a-4192-8e65-fac3ed198848.gif",link:"https://discord.gg/H5QhfZAjKr"},
      {role:"Moderator",title:"Rivals Media",desc:"Assisted in posting people!",img:"https://r2.haunt.gg/project/53c9fd80-34e1-4533-9d87-80996c5d7e8b.webp",link:"https://discord.gg/rivalstv"},
      {role:"Moderator",title:"Fang",desc:"Played a key role in establishing server structure, rules, and staff systems, while supporting moderation operations and helping manage and grow the community.",img:"https://r2.haunt.gg/project/108d058f-8092-4cff-83a1-c533188c53aa.webp",link:"https://discord.gg/vXuZwWT2F4"},
      {role:"Moderator",title:"Xorf's",desc:"Responsible for enforcing rules, monitoring chats, handling reports, resolving conflicts, and maintaining a safe and friendly community.",img:"https://r2.haunt.gg/project/28e02af9-af3e-4190-908c-d64ae165df91.webp",link:"https://discord.gg/xedkKawmxZ"},
      {role:"Manager",title:"Holds",desc:"Responsible for overseeing moderators, managing channels and roles, handling tickets and escalations, and ensuring smooth server operations.",img:"https://r2.haunt.gg/project/39e6974b-73ce-481e-9314-66037a4fa619.webp",link:"https://discord.gg/yjv5qbg2fN"},
      {role:"Server Manager",title:"Arko's Kingdom",desc:"Collaborated with other staff members to improve server policies, refine rules, and implement better moderation practices.",img:"https://r2.haunt.gg/project/28089fe2-3035-4d8a-a6bd-74bb3bab0c2f.webp",link:"https://discord.gg/jZyGa3dJA"},
    ];
    try{
      const custom=JSON.parse(localStorage.getItem('vaultProjects')||'[]');
      if(Array.isArray(custom)&&custom.length)projects.unshift(...custom);
    }catch(e){}
    const grid=document.getElementById('projectsGrid');
    grid.innerHTML=projects.map((p,i)=>{
      const isWide=(i===2);
      return `<div class="min-w-0 relative min-h-0 ${isWide?'sm:col-span-2':'col-span-1'}"><a href="${p.link}" target="_blank" rel="noreferrer noopener" class="block size-full"><div class="group relative h-full affiliation-card profile-card"><div class="relative size-full overflow-hidden" style="border-radius:42px"><div class="affiliation-bg" style="background-image:url(${p.img})"></div><div class="affiliation-gradient"></div><div class="absolute start-3 top-3 flex flex-wrap gap-1 sm:gap-2 z-10"><span class="btn-badge">${p.role}</span></div><div class="absolute inset-x-0 bottom-0 p-3 sm:p-4 z-10"><h3 class="mb-1 font-bold text-lg sm:text-xl" style="color:#ccd8ec">${p.title}</h3><p class="line-clamp-2 text-base" style="color:rgba(204,216,236,0.9)">${p.desc}</p></div></div></div></a></div>`;
    }).join('');

    try{var _vb=localStorage.getItem('vaultBg');if(_vb){document.querySelectorAll('video').forEach(function(v){var s=v.querySelectorAll('source');for(var i=0;i<s.length;i++)s[i].remove();v.src=_vb;v.load()})}}catch(e){}
  </script>
<script src="/bg.js" defer></script>
<script src="/guestbook.js" defer></script>
</body>
</html>
