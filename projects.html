  <style>
*, *::before, *::after { box-sizing: border-box; }
    *, *::before, *::after { cursor: url('cursor.png') 17 17, auto !important; }
    body { margin: 0; padding: 0; font-family: 'Satoshi', sans-serif; background: #000; color: #ccd8ec; min-height: 100vh; overflow-x: hidden; }
    .profile-card { background: rgba(218,220,247,0); background-clip: padding-box; color: #ccd8ec; border: 2px solid rgba(110,184,236,0.13); border-radius: 44px; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); position: relative; }
    .affiliation-card { position: relative; height: 100%; overflow: hidden; border-radius: 42px; cursor: pointer; transition: transform 0.5s ease; }
    .affiliation-card:hover .affiliation-bg { transform: scale(1.05); }
    .affiliation-bg { position: absolute; inset: 0; background-size: cover; background-position: center; background-color: rgba(10,10,10,0.8); transition: transform 0.5s ease; }
    .affiliation-gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.4), transparent); }
    .btn-badge { background-color: rgba(218,220,247,0.1); border: 1px solid rgba(110,184,236,0.23); border-radius: 26px; color: #ccd8ec; padding: 0.25rem 0.625rem; font-size: 0.875rem; font-weight: 500; backdrop-filter: blur(12px); display: inline-flex; align-items: center; gap: 0.25rem; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .side-nav { position: fixed; left: 24px; top: 50%; z-index: 50; transform: translateY(-50%); display: none; flex-direction: column; gap: 12px; }
    @media (min-width: 768px) { .side-nav { display: flex; } }
    .side-nav a { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 300; letter-spacing: 0.05em; text-decoration: none; transition: color 0.2s; color: rgba(255,255,255,0.4); }
    .side-nav a:hover { color: rgba(255,255,255,0.7); }
    .side-nav a.active { color: #fff; }
    .side-nav a .nav-line { height: 1px; width: 8px; background: rgba(255,255,255,0.4); transition: all 0.2s; flex-shrink: 0; }
    .side-nav a:hover .nav-line { width: 12px; background: rgba(255,255,255,0.7); }
    .side-nav a.active .nav-line { width: 16px; background: #fff; }
    .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; border-top: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; }
    @media (min-width: 768px) { .mobile-nav { display: none; } }
    .mobile-nav a { flex: 1; text-align: center; padding: 12px 4px; font-size: 0.625rem; font-weight: 300; letter-spacing: 0.05em; color: rgba(255,255,255,0.4); text-decoration: none; transition: color 0.2s; }
    .mobile-nav a.active, .mobile-nav a:hover { color: #fff; }
    @media (min-width: 768px) { #mainContent { padding-left: 80px; } }
    @keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .anim-reveal{animation:fadeInUp 0.5s ease forwards}
    .anim-delay-1{animation-delay:0.1s;opacity:0}
    .anim-delay-2{animation-delay:0.2s;opacity:0}
    .anim-delay-3{animation-delay:0.3s;opacity:0}
    .anim-delay-4{animation-delay:0.4s;opacity:0}
    .anim-delay-5{animation-delay:0.5s;opacity:0}
    .chip{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.55);border-radius:999px;padding:4px 14px;font-size:0.75rem;font-weight:500;font-family:inherit;cursor:pointer;transition:all .25s;backdrop-filter:blur(8px)}
    .chip:hover{color:#fff;border-color:rgba(255,255,255,0.3)}
    .chip.active{background:#ff4655;border-color:#ff4655;color:#fff}
    .affiliation-card::after{content:'';position:absolute;inset:0;border-radius:42px;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(85,115,244,0.18),transparent 70%)}
    .group:hover .affiliation-card::after{opacity:1}
    .group:hover .affiliation-card{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,0.45)}
    .projects-hidden{display:none!important}
  </style>

  <div class="dark contents">
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" style="background-color:#000"></div>

    <main class="relative flex w-full flex-col items-center text-white font-satoshi" id="mainContent">
      <!-- Header -->
      <section class="relative flex w-full flex-col items-center px-4" style="padding-top:48px;padding-bottom:16px">
        <div class="w-full max-w-3xl anim-reveal">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">

          </div>
          <p style="font-size:0.9rem;color:#9CA3AF;margin:0 0 0 16px">servers or projects i am actively involved in</p>

          <div class="flex flex-wrap gap-2" style="margin:18px 0 0 16px" id="roleFilters"></div>
        </div>
      </section>

      <!-- Projects Grid -->

          <div class="w-full">

<script>
    const defaults=[
      {role:"Adminstrator",title:"Rivals Competitive League",desc:"Leads the charge on moderation and addressing fair-play violations.",img:"/assets/img/projects/6b89fdd9-b736-4367-b87c-80df070d0c2f.webp",link:"https://discord.gg/BuDr9eYt9m"},
      {role:"Tester",title:"DUELISTS",desc:"Tasked with proposing ideas and ticket managing.",img:"/assets/img/projects/029feceb-48da-4dd8-98e6-d22de74d1688.webp",link:"https://discord.gg/tGSH8649xR"},
      {role:"Moderator",title:"ALCHEMY",desc:"Handled moderation tickets, resolving user reports, while keeping chat engaged.",img:"/assets/img/projects/d90e60cf-dab9-4f16-8164-98e3913f1b4c.webp",link:"https://discord.gg/sFFSJAQhBs"},
      {role:"Manager",title:"MRC",desc:"Oversaw moderation staff, enforced rules, managed channels and roles, handled reports, and ensured smooth daily server operations.",img:"/assets/img/projects/d4b066e4-b243-4802-a52d-24a1d9427267.png",link:"https://discord.gg/BTdpkjQQbu"},
      {role:"Tester",title:"lu studiosT",desc:"Roblox game tester responsible for playtesting new features, identifying bugs and exploits, providing feedback on gameplay balance, and reporting issues to developers before public release.",img:"/assets/img/projects/a7ed631c-c7f0-46f2-992c-150f4d3da784.webp",link:"https://discord.gg/GXgSEXB3tY"},
      {role:"Moderator",title:"Muz Crew",desc:"Managed support ticket systems, reviewed applications, handled user reports, enforced rules, and helped maintain an organized and safe community.",img:"/assets/img/projects/f90a300b-af49-4b59-952a-2fc472a77302.webp",link:"https://discord.gg/wQwkDQrhNa"},
      {role:"Manager",title:"Rivals Competitive Hangout",desc:"Handled moderation tickets, reviewed user reports, managed rule enforcement, and helped keep the server active and well-organized.",img:"/assets/img/projects/be758949-e82a-4192-8e65-fac3ed198848.gif",link:"https://discord.gg/H5QhfZAjKr"},
      {role:"Moderator",title:"Rivals Media",desc:"Assisted in posting people!",img:"/assets/img/projects/53c9fd80-34e1-4533-9d87-80996c5d7e8b.webp",link:"https://discord.gg/rivalstv"},
      {role:"Moderator",title:"Fang",desc:"Played a key role in establishing server structure, rules, and staff systems, while supporting moderation operations and helping manage and grow the community.",img:"/assets/img/projects/108d058f-8092-4cff-83a1-c533188c53aa.webp",link:"https://discord.gg/vXuZwWT2F4"},
      {role:"Moderator",title:"Xorf's",desc:"Responsible for enforcing rules, monitoring chats, handling reports, resolving conflicts, and maintaining a safe and friendly community.",img:"/assets/img/projects/28e02af9-af3e-4190-908c-d64ae165df91.webp",link:"https://discord.gg/xedkKawmxZ"},
      {role:"Manager",title:"Holds",desc:"Responsible for overseeing moderators, managing channels and roles, handling tickets and escalations, and ensuring smooth server operations.",img:"/assets/img/projects/39e6974b-73ce-481e-9314-66037a4fa619.webp",link:"https://discord.gg/yjv5qbg2fN"},
      {role:"Server Manager",title:"Arko's Kingdom",desc:"Collaborated with other staff members to improve server policies, refine rules, and implement better moderation practices.",img:"/assets/img/projects/28089fe2-3035-4d8a-a6bd-74bb3bab0c2f.webp",link:"https://discord.gg/jZyGa3dJA"},
    ];
    function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function renderProjects(){
      let projects=[];
      try{
        const stored=JSON.parse(localStorage.getItem('vaultProjects')||'[]');
        const ovr={},cust=[];
        if(Array.isArray(stored))stored.forEach(s=>{ if(s&&s.__o){ovr[s.base||s.title]=s}else{cust.push(s)} });
        defaults.forEach(d=>{
          const o=ovr[d.title];
          if(o){
            if(!o.hide){
              const m=Object.assign({},d,o);
              if(!m.img)m.img=d.img;
              if(!m.link)m.link=d.link;
              projects.push(m);
            }
          }else projects.push(d);
        });
        projects.unshift(...cust);
      }catch(e){ projects=defaults.slice() }
      const grid=document.getElementById('projectsGrid');
      grid.innerHTML=projects.map((p,i)=>{
        return `<div data-role="${esc(p.role)}" data-fx-reveal class="min-w-0 relative min-h-0" style="aspect-ratio:1/1;transition-delay:${(i%5)*60}ms"><a href="${esc(p.link)}" target="_blank" rel="noreferrer noopener" class="block size-full" data-ana="${esc(p.title)}"><div class="group relative h-full affiliation-card profile-card"><div class="relative size-full overflow-hidden" style="border-radius:42px"><div class="affiliation-bg" style="background-image:url('${esc(p.img)}')"></div><div class="affiliation-gradient"></div><div class="absolute left-2 top-2 z-10"><span class="btn-badge" style="font-size:0.7rem;padding:0.15rem 0.5rem">${esc(p.role)}</span></div><div class="absolute inset-x-0 bottom-0 p-2 sm:p-4 z-10"><h3 class="mb-1 font-bold text-sm sm:text-lg leading-tight" style="color:#ccd8ec">${esc(p.title)}</h3><p class="line-clamp-2 text-xs sm:text-sm leading-snug" style="color:rgba(204,216,236,0.9)">${esc(p.desc)}</p></div></div></div></a></div>`;
      }).join('');
      const countEl=document.getElementById('roleCount');
      if(countEl)countEl.textContent=projects.length+(projects.length===1?' role':' roles');
      renderRoleFilters(projects);
    }
    renderProjects();
    if(window.Syn)Syn.pull('projects',v=>{if(v&&Syn.apply('vaultProjects',v))renderProjects()});

    // ========== ROLE FILTER CHIPS (auto-built from roles) ==========
    function applyFilter(key){
      const cards=document.getElementById('projectsGrid').children;
      for(let i=0;i<cards.length;i++){
        const role=cards[i].getAttribute('data-role');
        if(key==='all'||role===key)cards[i].classList.remove('projects-hidden');
        else cards[i].classList.add('projects-hidden');
      }
    }
    function renderRoleFilters(projects){
      const box=document.getElementById('roleFilters');
      if(!box)return;
      const roles=[];
      projects.forEach(p=>{const r=(p.role||'').trim(); if(r&&roles.indexOf(r)===-1)roles.push(r)});
      roles.sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}));
      const cur=box.querySelector('.chip.active');
      let curKey=cur?cur.getAttribute('data-role'):'all';
      if(curKey!=='all'&&roles.indexOf(curKey)===-1)curKey='all';
      const labels=[{role:'all',label:'All'}].concat(roles.map(r=>({role:r,label:r})));
      box.innerHTML=labels.map(o=>'<button type="button" data-role="'+esc(o.role)+'" class="chip'+(o.role===curKey?' active':'')+'" aria-pressed="'+(o.role===curKey?'true':'false')+'">'+esc(o.label)+'</button>').join('');
      applyFilter(curKey);
    }
    (function bindFilters(){
      const chips=document.getElementById('roleFilters');
      if(!chips)return;
      chips.addEventListener('click',e=>{
        const b=e.target.closest('button[data-role]');
        if(!b)return;
        const key=b.getAttribute('data-role');
        const list=chips.querySelectorAll('button[data-role]');
        for(let i=0;i<list.length;i++){list[i].classList.toggle('active',list[i]===b);list[i].setAttribute('aria-pressed',list[i]===b?'true':'false');}
        applyFilter(key);
      });
    })();

    // ========== CARD HOVER SPOTLIGHT ==========
    (function bindSpotlight(){
      const grid=document.getElementById('projectsGrid');
      if(!grid)return;
      grid.addEventListener('mousemove',e=>{
        const card=e.target.closest?e.target.closest('.affiliation-card'):null;
        if(!card)return;
        const r=card.getBoundingClientRect();
        card.style.setProperty('--mx',(e.clientX-r.left)+'px');
        card.style.setProperty('--my',(e.clientY-r.top)+'px');
      });
    })();

    try{var _vb=localStorage.getItem('vaultBg');if(_vb){document.querySelectorAll('video').forEach(function(v){var s=v.querySelectorAll('source');for(var i=0;i<s.length;i++)s[i].remove();v.src=_vb;v.load()})}}catch(e){}
  </script>
