<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends | home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Satoshi', sans-serif;
            background: #000;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.3;
            pointer-events: none;
        }

        .side-nav{position:fixed;left:24px;top:50%;z-index:50;transform:translateY(-50%);display:none;flex-direction:column;gap:12px}
        @media(min-width:768px){.side-nav{display:flex}}
        .side-nav a{display:flex;align-items:center;gap:8px;font-size:0.75rem;font-weight:300;letter-spacing:0.05em;text-decoration:none;transition:color 0.2s;color:rgba(255,255,255,0.4)}
        .side-nav a:hover{color:rgba(255,255,255,0.7)}
        .side-nav a.active{color:#fff}
        .side-nav a .nav-line{height:1px;width:8px;background:rgba(255,255,255,0.4);transition:all 0.2s;flex-shrink:0}
        .side-nav a:hover .nav-line{width:12px;background:rgba(255,255,255,0.7)}
        .side-nav a.active .nav-line{width:16px;background:#fff}
        .mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;border-top:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex}
        @media(min-width:768px){.mobile-nav{display:none}}
        .mobile-nav a{flex:1;text-align:center;padding:12px 4px;font-size:0.625rem;font-weight:300;letter-spacing:0.05em;color:rgba(255,255,255,0.4);text-decoration:none;transition:color 0.2s}
        .mobile-nav a.active,.mobile-nav a:hover{color:#fff}

.main-content {
            padding: 40px 60px;
            padding-left: 120px;
            padding-bottom: 90px;
            position: relative;
            z-index: 10;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
        }

        .accent-bar {
            width: 50px;
            height: 4px;
            background: linear-gradient(90deg, #5573f4, #4764ec);
            border-radius: 2px;
            margin-bottom: 16px;
        }

        .friend-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 28px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .friend-card:hover {
            transform: scale(1.03);
            border-color: rgba(64, 120, 255, 0.3);
            box-shadow: 0 0 30px rgba(64, 120, 255, 0.1);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .social-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .social-pill:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
        }

        .affiliate-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 22px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .affiliate-badge:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .affiliate-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .cta-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .cta-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 68, 68, 0.4), rgba(64, 120, 255, 0.4), rgba(155, 89, 182, 0.4));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 12px;
            background: #5865F2;
            color: white;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .cta-btn:hover {
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.3);
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                margin-bottom: 70px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <video class="bg-video" autoplay muted loop playsinline>
        <source src="https://r2.haunt.gg/background/5f034507-f610-4968-98f3-b614bb7b4339.mp4#t=0.001" type="video/mp4">
    </video>

<nav class="side-nav">
        <a href="/"><span class="nav-line"></span>Home</a>
        <a href="/about"><span class="nav-line"></span>About</a>
        <a href="/music"><span class="nav-line"></span>Music</a>
        <a href="/gallery"><span class="nav-line"></span>Gallery</a>
        <a href="/projects"><span class="nav-line"></span>Projects</a>
        <a href="/friends" class="active"><span class="nav-line"></span>Friends</a>
    
        <a href="/widgets"><span class="nav-line"></span>Widgets</a>
        <a href="/valorant"><span class="nav-line"></span>Valorant</a>
        <button data-gb style="background:none;border:0;padding:0;font-family:'Satoshi',sans-serif;display:flex;align-items:center;gap:8px;font-size:0.75rem;font-weight:300;letter-spacing:0.05em;text-decoration:none;transition:color 0.2s;color:rgba(255,255,255,0.4)"><span class="nav-line"></span>Guestbook</button>
    </nav>
    <nav class="mobile-nav">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/music">Music</a>
        <a href="/gallery">Gallery</a>
        <a href="/projects">Projects</a>
        <a href="/friends" class="active">Friends</a>
        
        <a href="/widgets">Widgets</a>
        <a href="/valorant">Valorant</a>
        <button data-gb style="background:none;border:0;padding:0;font-family:'Satoshi',sans-serif;color:rgba(255,255,255,0.4);font-size:0.625rem;font-weight:300;letter-spacing:0.05em;cursor:pointer">Guestbook</button>
    </nav>

    <main class="main-content">

        <div style="margin-bottom: 48px;">
            <div class="accent-bar"></div>
            <h1 style="font-size: 40px; font-weight: 900; color: white; margin-bottom: 6px;">Friends</h1>
            <p style="font-size: 16px; color: rgba(255,255,255,0.4);">people I appreciate</p>
        </div>

<div style="margin-bottom: 56px;">
            <div class="section-title">Close Friends</div>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;" id="friendsGrid">
            </div>
        </div>

        <div style="margin-bottom: 56px;">
            <div class="section-title">Want to be friends?</div>
            <div class="cta-card">
                <h3 style="font-size: 22px; font-weight: 700; color: white; margin-bottom: 10px;">Let's Connect</h3>
                <p style="font-size: 15px; color: rgba(255,255,255,0.45); margin-bottom: 28px; max-width: 520px; line-height: 1.7;">If you'd like to connect, feel free to add me on Discord or join my server!</p>
                <a href="https://discord.com/users/704140288716701737" target="_blank" rel="noopener" class="cta-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286z"/></svg>
                    Join Discord
                </a>
            </div>
        </div>

        </main>

<script>
            try{
                const friends=JSON.parse(localStorage.getItem('vaultFriends')||'[]');
                const grid=document.getElementById('friendsGrid');
                if(Array.isArray(friends)&&friends.length){
                    if(grid)friends.forEach(f=>{
                        const card=document.createElement('div');
                        card.className='friend-card';
                        card.innerHTML='<div class="avatar" style="background: linear-gradient(135deg, '+(f.bg1||'#5573f4')+', '+(f.bg2||'#4764ec')+');">'+(f.initial||'?')+'</div>'+
                        '<h3 style="font-size: 18px; font-weight: 700; color: white; margin-bottom: 4px;">'+f.name+'</h3>'+
                        '<p style="font-size: 13px; color: rgba(255,255,255,0.45); margin-bottom: 0;">'+(f.note||'')+'</p>';
                        grid.appendChild(card);
                    });
                }else if(grid){
                    grid.innerHTML='<p style="font-size: 14px; color: rgba(255,255,255,0.4); grid-column: 1 / -1;">no friends listed yet.</p>';
                }
            }catch(e){}
            try{var _vb=localStorage.getItem('vaultBg');if(_vb){document.querySelectorAll('video').forEach(function(v){var s=v.querySelectorAll('source');for(var i=0;i<s.length;i++)s[i].remove();v.src=_vb;v.load()})}}catch(e){}
        </script>

<script src="/bg.js" defer></script>
<script src="/guestbook.js" defer></script>
</body>
</html>
